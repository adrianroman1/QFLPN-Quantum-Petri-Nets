name: QFLPN CSR Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run JUnit tests
        run: mvn -B test

      - name: Run CSR smoke validation
        run: mvn -B -DskipTests compile exec:java

      - name: Run CSR benchmark smoke
        run: >
          mvn -B
          -DskipTests
          -Dexec.mainClass=hpc.csr.BenchmarkRunner
          -Dexec.args="--n=1000000 --warmup=1 --iterations=2 --threshold=4096 --parallelism=2"
          exec:java