name: QFLPN P2 Validation

on:
  push:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  pull_request:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-validation:
    name: P2 Mathematical, Software and Integrity Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P2/requirements-p2.txt

      - name: Install P2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r P2/requirements-p2.txt

      - name: Record execution environment
        run: |
          mkdir -p P2/reports
          python --version > P2/reports/python-version.txt
          python -m pip freeze > P2/reports/pip-freeze.txt
          python -m pip check

      - name: Compile P2 source, tests and tools
        run: |
          python -m compileall -q P2/code P2/tests P2/tools

      - name: Validate required P2 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("P2")

          required = [
              "P2_AUDIT_REPORT.md",
              "REPRODUCIBILITY.md",
              "VALIDATION_ALIGNMENT.md",
              "requirements-p2.txt",
              "requirements-lock.txt",
              "code/qflpn_reference.py",
              "code/qflpn_transition_operator.py",
              "code/run_qflpn_pennylane.py",
              "reports/reference_config.json",
              "tests/conftest.py",
              "tests/qflpn_validation.py",
              "tools/run_all_tests.py",
              "tools/generate_manifest.py",
              "tools/verify_sha256.py",
              "tools/generate_sha256sums.py",
              "tools/verify_sha256sums.py",
              "tools/validate_reports.py",
          ]

          missing = [
              item for item in required
              if not (root / item).is_file()
          ]

          if missing:
              print("MISSING REQUIRED P2 FILES:")
              for item in missing:
                  print("-", item)
              sys.exit(1)

          print("P2_REQUIRED_FILES_ACCEPTED")
          PY

      - name: Validate reference configuration
        run: |
          python - <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          path = Path("P2/reports/reference_config.json")

          try:
              config = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print("Invalid reference configuration:", exc)
              sys.exit(1)

          expected = {
              "qubits": 4,
              "hilbert_dimension": 16,
              "basis_order": "big-endian",
              "activation_vector": [0.85, 0.90, 0.45, 0.70],
              "controlled_gate": "C3X",
              "basis_indices": [14, 15],
              "operator_order": "U=C3X @ U_rot",
              "entropy_unit": "bits",
          }

          for key, value in expected.items():
              actual = config.get(key)

              if actual != value:
                  print(
                      f"Configuration mismatch for {key}: "
                      f"expected={value!r}, actual={actual!r}"
                  )
                  sys.exit(1)

          print("P2_REFERENCE_CONFIGURATION_ACCEPTED")
          PY

      - name: Run complete P2 test suite
        run: |
          python P2/tools/run_all_tests.py -v

      - name: Run standalone mathematical validation
        run: |
          python P2/tests/qflpn_validation.py

      - name: Generate manuscript-aligned reference artifacts
        run: |
          python P2/tools/generate_reference_artifacts.py

      - name: Validate generated reference artifacts
        run: |
          python -m pytest P2/tests/test_reference_artifacts.py -v

      - name: Validate machine-readable test evidence
        run: |
          python P2/tools/validate_reports.py

      - name: Generate P2 source manifest
        run: |
          python P2/tools/generate_manifest.py

      - name: Verify P2 source manifest
        run: |
          python P2/tools/verify_sha256.py

      - name: Generate P2 SHA256SUMS inventory
        run: |
          python P2/tools/generate_sha256sums.py

      - name: Verify complete P2 SHA256SUMS inventory
        run: |
          python P2/tools/verify_sha256sums.py

      - name: Upload P2 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-validation-evidence
          if-no-files-found: warn
          path: |
            P2/reports/
            P2/MANIFEST.txt
            P2/SHA256SUMS.txt
