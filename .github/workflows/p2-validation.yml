name: QFLPN P2 Validation

on:
  push:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  pull_request:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qflpn-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-validation:
    name: P2 Mathematical, Software and Integrity Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "P2/requirements-p2.txt"

      - name: Install P2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r P2/requirements-p2.txt

      - name: Record execution environment
        run: |
          mkdir -p P2/reports
          python --version > P2/reports/python-version.txt
          python -m pip freeze > P2/reports/pip-freeze.txt
          python -m pip check

      - name: Compile P2 source, tests and tools
        run: |
          python -m compileall -q P2/code P2/tests P2/tools

      - name: Validate required P2 files
        run: |
          set -eu

          test -f P2/code/qflpn_reference.py

          test -f P2/reports/reference_config.json

          test -f P2/tests/test_reference.py
          test -f P2/tests/test_manuscript_alignment.py
          test -f P2/tests/test_ordering_sensitivity.py
          test -f P2/tests/test_reference_invariants.py
          test -f P2/tests/test_entanglement.py
          test -f P2/tests/test_entanglement_metrics.py
          test -f P2/tests/test_pennylane_parity.py
          test -f P2/tests/qflpn_validation.py

          test -f P2/tests/test_published_tables.py
          test -f P2/tests/test_reference_artifacts.py

          test -f P2/tools/run_all_tests.py
          test -f P2/tools/validate_reports.py
          test -f P2/tools/generate_manifest.py
          test -f P2/tools/verify_sha256.py
          test -f P2/tools/generate_reference_artifacts.py

          test -f P2/REPRODUCIBILITY.md

      - name: Validate reference configuration
        run: |
          python -c "
          import json
          from pathlib import Path

          path = Path('P2/reports/reference_config.json')
          config = json.loads(path.read_text(encoding='utf-8'))

          assert config['schema_version'] == 1
          assert config['qubits'] == 4
          assert config['hilbert_dimension'] == 16
          assert config['basis_order'] == 'big-endian'
          assert config['activation_vector'] == [0.85, 0.90, 0.45, 0.70]
          assert config['controlled_gate'] == 'C3X'
          assert config['controlled_gate_basis_indices'] == [14, 15]
          assert config['operator_order'] == 'U = C3X @ U_rot'
          assert config['entropy_unit'] == 'bits'

          print('PASS: P2 reference configuration')
          "

      - name: Run complete P2 test suite
        run: |
          python P2/tools/run_all_tests.py -v

      - name: Run standalone mathematical validation
        run: |
          set -eu
          export PYTHONPATH="$GITHUB_WORKSPACE/P2/code${PYTHONPATH:+:$PYTHONPATH}"
          python P2/tests/qflpn_validation.py \
            2>&1 | tee P2/reports/qflpn-validation.log

      - name: Generate manuscript-aligned reference artifacts
        run: |
          python P2/tools/generate_reference_artifacts.py \
            --config P2/reports/reference_config.json \
            --output P2/reports/reference_artifacts

      - name: Validate generated reference artifacts
        run: |
          python -c "
          import csv
          import json
          from pathlib import Path
          import numpy as np

          root = Path('P2/reports/reference_artifacts')

          expected = {
              'state_vector.csv',
              'probabilities.csv',
              'density_matrix.csv',
              'reduced_density_q4.csv',
              'reduced_density_q123.csv',
              'metadata.json',
          }

          actual = {p.name for p in root.iterdir() if p.is_file()}
          missing = expected - actual

          assert not missing, f'Missing artifacts: {sorted(missing)}'

          with (root / 'probabilities.csv').open(
              newline='',
              encoding='utf-8'
          ) as stream:
              rows = list(csv.DictReader(stream))

          probabilities = np.array(
              [float(row['probability']) for row in rows],
              dtype=np.float64
          )

          assert probabilities.shape == (16,)
          assert np.all(np.isfinite(probabilities))
          assert np.all(probabilities >= 0.0)
          assert np.isclose(
              probabilities.sum(),
              1.0,
              atol=1e-12,
              rtol=0.0
          )

          metadata = json.loads(
              (root / 'metadata.json').read_text(encoding='utf-8')
          )

          assert metadata['state_dimension'] == 16
          assert np.isclose(
              metadata['state_norm'],
              1.0,
              atol=1e-12,
              rtol=0.0
          )
          assert np.isclose(
              metadata['probability_sum'],
              1.0,
              atol=1e-12,
              rtol=0.0
          )

          print('PASS: generated reference artifacts')
          "

      - name: Validate machine-readable test evidence
        if: always()
        run: |
          python P2/tools/validate_reports.py

      - name: Generate P2 source manifest
        if: always()
        run: |
          python P2/tools/generate_manifest.py

      - name: Verify P2 source manifest and SHA-256 inventory
        if: always()
        run: |
          python P2/tools/verify_sha256.py

      - name: Upload P2 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qflpn-p2-validation-${{ github.run_id }}
          path: |
            P2/reports/
            P2/MANIFEST.txt
            P2/tests/results/
          if-no-files-found: warn
          retention-days: 90
