name: QFLPN P2 Validation

on:
  push:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  pull_request:
    paths:
      - "P2/**"
      - ".github/workflows/p2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qflpn-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-validation:
    name: P2 Tests and Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "P2/requirements-lock.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r P2/requirements-lock.txt

      - name: Display environment
        run: |
          python --version
          python -m pip freeze

      - name: Run P2 test suite
        run: |
          python P2/tools/run_all_tests.py -v

      - name: Validate JSON reports
        run: |
          python P2/tools/validate_reports.py

      - name: Generate SHA-256 manifest
        run: |
          python P2/tools/generate_manifest.py

      - name: Verify SHA-256 manifest
        run: |
          python P2/tools/verify_sha256.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qflpn-p2-validation-${{ github.run_id }}
          path: |
            P2/MANIFEST.txt
            P2/reports/
          if-no-files-found: warn
          retention-days: 30
