name: QFLPN P3 Validation and Benchmark

on:
  push:
    branches: [main]
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qflpn-p3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3-validation:
    name: P3 build, tests, benchmark and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Record validation identity
        run: |
          {
            echo "## P3 validation identity"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Python: $(python --version)"
            echo "- Java:"
            java -version 2>&1
            echo "- Maven:"
            mvn --version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate root Maven project
        run: mvn -B -f pom.xml validate

      - name: Test root Maven project
        run: mvn -B -f pom.xml clean test

      - name: Validate P3 Maven project
        run: mvn -B -f P3/pom.xml validate

      - name: Test complete P3 Maven project
        run: mvn -B -f P3/pom.xml clean test

      - name: Test P3 Python validator and integrity tools
        run: |
          python -m pytest -q \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py

      - name: Check Python syntax
        run: |
          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py

      - name: Run benchmark and validate CSV evidence
        env:
          N: "1000000"
          WARMUP: "5"
          ITERATIONS: "10"
          THRESHOLD: "4096"
          PARALLELISM: "2"
          RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
        run: bash P3/results/run_benchmark.sh

      - name: Verify benchmark CSV independently
        run: |
          python P3/results/validate_benchmark.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --expected-n 1000000 \
            --warmup 5 \
            --iterations 10 \
            --threshold 4096 \
            --parallelism 2

      - name: Generate deterministic P3 manifest and hashes
        run: |
          python P3/tools/generate_integrity.py --write --root P3
          python P3/tools/generate_integrity.py --check --root P3

      - name: Independently verify P3 integrity
        run: python P3/tools/verify_integrity.py --root P3

      - name: Generate benchmark job summary
        if: always()
        run: |
          python P3/results/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/validation-report.json" \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload P3 benchmark and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            P3/benchmarks/benchmark_results_v2.csv
            P3/results/raw/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload root Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-maven-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload P3 Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-maven-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: P3/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Python test report context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-python-test-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            P3/results/test_validate_benchmark.py
            P3/tests/test_generate_integrity.py
            P3/tests/test_verify_integrity.py
          if-no-files-found: warn
          retention-days: 30
