name: QFLPN P3 Validation

on:
  push:
    branches: [main]
    paths:
      - "P3/**"
      - ".github/workflows/p3-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "P3/**"
      - ".github/workflows/p3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p3-validation:
    name: P3 CSR, SpMV and JUnit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Record Java and Maven environment
        run: |
          java -version
          mvn --version

      - name: Validate P3 Maven project
        run: mvn -B -f P3/pom.xml validate

      - name: Run complete P3 JUnit test suite
        run: mvn -B -f P3/pom.xml test

      - name: Upload P3 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-validation-evidence
          path: P3/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90
