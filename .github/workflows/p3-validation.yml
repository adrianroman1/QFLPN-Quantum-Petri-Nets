name: P3 Validation — Full Evidence and Integrity Chain

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3_validation:
    name: P3 — Complete Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      P3_ROOT: P3
      N: "1000000"
      WARMUP: "5"
      ITERATIONS: "10"
      THRESHOLD: "4096"
      PARALLELISM: "2"
      P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
      P3_REPORTS: P3/reports
      P3_RAW_ROOT: P3/results/raw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture source revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "P3_SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"
          echo "P3_RUN_ID=${P3_RUN_ID}" >> "$GITHUB_ENV"
          mkdir -p "${P3_RAW_ROOT}/${P3_RUN_ID}" "${P3_REPORTS}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify required P3 files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "P3/pom.xml"
            "P3/benchmarks/benchmark_results_v2.csv"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/verify_evidence_consistency.py"
            "P3/tools/verify_final_package.py"
            "P3/tools/compute_checksums.py"
            "P3/tests/test_verify_evidence_consistency.py"
            "P3/tests/test_verify_final_package.py"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required P3 file is missing: $file"
              exit 1
            fi
          done

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q P3/results P3/tools P3/tests

      - name: Run P3 Python test suite
        id: python_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${P3_RAW_ROOT}/${P3_RUN_ID}"

          set +e
          python -m pytest -q P3/tests P3/results \
            --junitxml="${P3_RAW_ROOT}/${P3_RUN_ID}/pytest-results.xml" \
            2>&1 | tee "${P3_RAW_ROOT}/${P3_RUN_ID}/pytest.log"
          status=${PIPESTATUS[0]}
          set -e

          echo "pytest_exit_code=${status}" \
            > "${P3_RAW_ROOT}/${P3_RUN_ID}/pytest-status.txt"

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Run root Maven tests
        id: root_maven
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pom.xml ]]; then
            mvn -B -ntp clean test \
              2>&1 | tee "${P3_RAW_ROOT}/${P3_RUN_ID}/root-maven.log"
          else
            echo "No root pom.xml; root Maven stage is not applicable."
          fi

      - name: Run P3 Maven tests
        id: p3_maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f P3/pom.xml clean test \
            2>&1 | tee "${P3_RAW_ROOT}/${P3_RUN_ID}/p3-maven.log"

      - name: Capture execution environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          run_id = os.environ["P3_RUN_ID"]
          raw = Path("P3/results/raw") / run_id
          raw.mkdir(parents=True, exist_ok=True)

          def command_output(*args):
              try:
                  return subprocess.check_output(
                      args, text=True, stderr=subprocess.STDOUT
                  ).strip()
              except Exception as exc:
                  return f"UNAVAILABLE: {exc}"

          payload = {
              "schema": "qflpn-p3-environment-v1",
              "run_id": run_id,
              "source_commit": os.environ["P3_SOURCE_COMMIT"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "java": command_output("java", "-version"),
              "maven": command_output("mvn", "-version"),
              "dimension": int(os.environ["N"]),
              "warmup": int(os.environ["WARMUP"]),
              "iterations": int(os.environ["ITERATIONS"]),
              "threshold": int(os.environ["THRESHOLD"]),
              "parallelism": int(os.environ["PARALLELISM"]),
          }

          (raw / "environment.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run canonical P3 V2 benchmark
        id: p3_benchmark
        shell: bash
        run: |
          set -euo pipefail

          chmod +x P3/results/run_benchmark.sh

          export RUN_ID="${P3_RUN_ID}"
          export SOURCE_COMMIT="${P3_SOURCE_COMMIT}"

          bash P3/results/run_benchmark.sh \
            2>&1 | tee "${P3_RAW_ROOT}/${P3_RUN_ID}/benchmark-run.log"

      - name: Validate canonical P3 V2 benchmark
        id: p3_v2_validation
        shell: bash
        run: |
          set -euo pipefail

          python P3/results/validate_benchmark.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --run-id "${P3_RUN_ID}" \
            --expected-n "${N}" \
            --warmup "${WARMUP}" \
            --iterations "${ITERATIONS}" \
            --threshold "${THRESHOLD}" \
            --parallelism "${PARALLELISM}" \
            --json-output "${P3_RAW_ROOT}/${P3_RUN_ID}/validation-report.json"

      - name: Generate P3 V2 benchmark summary
        id: p3_summary
        shell: bash
        run: |
          set -euo pipefail

          python P3/results/generate_benchmark_summary.py \
            --run-id "${P3_RUN_ID}" \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --output-dir "${P3_RAW_ROOT}/${P3_RUN_ID}"

      - name: Verify P3 evidence consistency
        id: p3_evidence
        shell: bash
        run: |
          set -euo pipefail

          python P3/tools/verify_evidence_consistency.py \
            --root . \
            --run-id "${P3_RUN_ID}" \
            --source-commit "${P3_SOURCE_COMMIT}" \
            --output "${P3_RAW_ROOT}/${P3_RUN_ID}/evidence-consistency.json"

      - name: Generate global MANIFEST and SHA256SUMS
        id: p3_integrity
        shell: bash
        run: |
          set -euo pipefail

          python P3/tools/compute_checksums.py \
            --root P3 \
            --manifest P3/MANIFEST.txt \
            --checksums P3/SHA256SUMS.txt

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

      - name: Verify final P3 package
        id: p3_final_verification
        shell: bash
        run: |
          set -euo pipefail

          python P3/tools/verify_final_package.py \
            --root . \
            --run-id "${P3_RUN_ID}" \
            --outcomes-json "${P3_RAW_ROOT}/${P3_RUN_ID}/ci-outcomes.json"

      - name: Record CI stage outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["P3_RUN_ID"]
          raw = Path("P3/results/raw") / run_id
          raw.mkdir(parents=True, exist_ok=True)

          stages = {
              "python_tests": "${{ steps.python_tests.outcome }}",
              "root_maven": "${{ steps.root_maven.outcome }}",
              "p3_maven": "${{ steps.p3_maven.outcome }}",
              "benchmark": "${{ steps.p3_benchmark.outcome }}",
              "v2_validation": "${{ steps.p3_v2_validation.outcome }}",
              "summary": "${{ steps.p3_summary.outcome }}",
              "evidence_consistency": "${{ steps.p3_evidence.outcome }}",
              "integrity": "${{ steps.p3_integrity.outcome }}",
              "final_verification": "${{ steps.p3_final_verification.outcome }}",
          }

          payload = {
              "schema": "qflpn-p3-ci-outcomes-v1",
              "run_id": run_id,
              "stages": stages,
          }

          (raw / "ci-outcomes.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload P3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            P3/reports/
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/benchmarks/benchmark_results_v2.csv
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
            P3/target/surefire-reports/
