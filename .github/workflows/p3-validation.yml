name: P3 Audit Validation

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run root Maven tests
        run: mvn -B test

      - name: Run P3 Maven tests
        run: |
          if [ -f "P3/pom.xml" ]; then
            mvn -B -f P3/pom.xml test
          else
            echo "No P3 pom.xml found; skipping."
          fi

      - name: Run benchmark script
        run: |
          if [ -f "P3/results/run_benchmark.sh" ]; then
            chmod +x P3/results/run_benchmark.sh
            bash P3/results/run_benchmark.sh
          else
            echo "Benchmark script not found; skipping."
          fi

      - name: Validate benchmark outputs
        run: |
          if [ -f "P3/results/validate_benchmark.py" ]; then
            python3 P3/results/validate_benchmark.py
          else
            echo "Validator not found; skipping."
          fi

      - name: Generate benchmark summary
        run: |
          if [ -f "P3/results/generate_benchmark_summary.py" ]; then
            python3 P3/results/generate_benchmark_summary.py
          else
            echo "Summary generator not found; skipping."
          fi

      - name: Run integrity checks
        run: |
          if [ -f "P3/tools/generate_integrity.py" ]; then
            python3 P3/tools/generate_integrity.py
          fi
          if [ -f "P3/tools/verify_integrity.py" ]; then
            python3 P3/tools/verify_integrity.py
          fi

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p3-validation-artifacts
          path: |
            P3/results/**
            P3/tools/**
            **/MANIFEST.txt
            **/SHA256SUMS.txt
            **/*.json
            **/*.csv
          if-no-files-found: warn
