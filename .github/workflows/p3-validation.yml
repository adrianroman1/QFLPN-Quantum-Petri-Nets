name: QFLPN P3 Validation and Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'P3/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/p3-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'P3/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/p3-validation.yml'
  workflow_dispatch:


concurrency:
  group: qflpn-p3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3-validation:
    name: P3 build, tests, benchmark and integrity
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Write credentials are enabled only in the dedicated evidence commit step.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate main Maven project
        run: mvn -B -f pom.xml validate

      - name: Test main Maven project
        run: mvn -B -f pom.xml clean test

      - name: Validate P3 Maven project
        run: mvn -B -f P3/pom.xml validate

      - name: Test complete P3 Maven project
        run: mvn -B -f P3/pom.xml clean test

      - name: Test benchmark validator and integrity tools
        run: |
          python -m pytest -q \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py

      - name: Run benchmark on push, pull request and manual dispatch
        env:
          N: '1000000'
          WARMUP: '5'
          ITERATIONS: '10'
          THRESHOLD: '4096'
          PARALLELISM: '2'
          RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}'
        run: bash P3/results/run_benchmark.sh

      - name: Generate independent manifest and SHA-256 inventory
        run: |
          python P3/tools/generate_integrity.py --write
          python P3/tools/verify_integrity.py --root P3

      - name: Generate benchmark job summary
        if: always()
        run: |
          python P3/tools/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/validation-report.json" \
            --output "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated evidence for the restricted commit job
        uses: actions/upload-artifact@v4
        with:
          name: p3-evidence-for-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            P3/benchmarks/benchmark_results_v2.csv
            P3/results/raw/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload benchmark and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            P3/benchmarks/benchmark_results_v2.csv
            P3/results/raw/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload main Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-maven-junit-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload P3 Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-maven-junit-${{ github.run_id }}
          path: P3/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90

  commit-evidence:
    name: Commit approved P3 evidence to main
    needs: p3-validation
    if: needs.p3-validation.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: p3-evidence-for-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: P3

      - name: Commit only approved evidence paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            P3/benchmarks/benchmark_results_v2.csv \
            P3/results/raw \
            P3/MANIFEST.txt \
            P3/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No approved evidence changes to commit.'
          else
            git commit -m 'chore(p3): record validated benchmark evidence [skip ci]'
            git push origin HEAD:main
          fi
