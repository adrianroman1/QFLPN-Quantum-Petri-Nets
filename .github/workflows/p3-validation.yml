name: P3 Validation — Full Evidence and Integrity Chain

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3_validation:
    name: P3 — Complete V2 + V3 Validation
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      P3_ROOT: P3

      # Canonical V2 benchmark configuration.
      N: "1000000"
      WARMUP: "5"
      ITERATIONS: "10"
      THRESHOLD: "4096"
      PARALLELISM: "2"

      # Independent V3 benchmark configuration.
      P3_V3_DIMENSION: "4096"
      P3_V3_WARMUP: "5"
      P3_V3_ITERATIONS: "10"

      P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
      P3_REPORTS: P3/reports
      P3_RAW_ROOT: P3/results/raw

    steps:
      # ============================================================
      # 1. CHECKOUT AND EXECUTION IDENTITY
      # ============================================================

      - name: Checkout repository
        id: p3_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture source commit and execution identity
        id: p3_environment
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          WORKFLOW_RUN_ID="${GITHUB_RUN_ID}"
          RUN_ID="${P3_RUN_ID}"

          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid source commit SHA."
            exit 1
          }

          [[ "${WORKFLOW_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid GitHub workflow run ID."
            exit 1
          }

          [[ "${RUN_ID}" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid P3 RUN_ID."
            exit 1
          }

          echo "P3_SOURCE_COMMIT=${SOURCE_COMMIT}" >> "${GITHUB_ENV}"
          echo "P3_WORKFLOW_RUN_ID=${WORKFLOW_RUN_ID}" >> "${GITHUB_ENV}"

          mkdir -p "${P3_RAW_ROOT}" "${P3_REPORTS}"

          RAW="${P3_RAW_ROOT}/${RUN_ID}"

          if [[ -e "${RAW}" || -L "${RAW}" ]]; then
            echo "::error::RUN_ID directory already exists: ${RAW}"
            echo "::error::Refusing to overwrite previous execution evidence."
            exit 1
          fi

          mkdir "${RAW}"

          {
            echo "P3_RUN_ID=${RUN_ID}"
            echo "P3_WORKFLOW_RUN_ID=${WORKFLOW_RUN_ID}"
            echo "P3_SOURCE_COMMIT=${SOURCE_COMMIT}"
            echo "P3_V2_DIMENSION=${N}"
            echo "P3_V3_DIMENSION=${P3_V3_DIMENSION}"
          } > "${RAW}/execution-identity.txt"

          echo "P3_EXECUTION_IDENTITY: PASS"
          cat "${RAW}/execution-identity.txt"

      # ============================================================
      # 2. TOOLCHAINS
      # ============================================================

      - name: Set up Java 21
        id: p3_java_setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        id: p3_python_setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python validation dependencies
        id: p3_python_dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

          python --version
          java -version
          mvn -version

      # ============================================================
      # 3. REQUIRED FILES AND STATIC VALIDATION
      # ============================================================

      - name: Verify required P3 files
        id: p3_required_files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "P3/pom.xml"
            "P3/code/BenchmarkV3Runner.java"
            "P3/code/BenchmarkV3ResultWriter.java"
            "P3/benchmarks/benchmark_results_v2.csv"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/validate_benchmark_v3.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/verify_evidence_consistency.py"
            "P3/tools/verify_final_package.py"
            "P3/tools/compute_checksums.py"
            "P3/tests/test_validate_benchmark_v3.py"
            "P3/tests/test_verify_evidence_consistency.py"
            "P3/tests/test_verify_final_package.py"
            "P3/tests/test_compute_checksums.py"
            ".github/workflows/p3-validation.yml"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "${file}" || -L "${file}" ]]; then
              echo "::error::Missing or unsafe required file: ${file}"
              exit 1
            fi
          done

          echo "P3_REQUIRED_FILES: PASS"

      - name: Compile all P3 Python sources
        id: p3_python_compile
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            P3/results \
            P3/tools \
            P3/tests

          echo "P3_PYTHON_COMPILE: PASS"

      # ============================================================
      # 4. COMPLETE PYTHON TEST SUITE
      # ============================================================

      - name: Run complete P3 Python test suite
        id: p3_python_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          set +e
          python -m pytest \
            -q \
            P3/tests \
            P3/results \
            --junitxml="${RAW}/pytest-results.xml" \
            2>&1 | tee "${RAW}/pytest.log"

          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          echo "${TEST_STATUS}" > "${RAW}/pytest-exit-code.txt"

          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            echo "::error::P3 Python test suite failed."
            exit "${TEST_STATUS}"
          fi

          echo "P3_PYTHON_TESTS: PASS"

      # ============================================================
      # 5. MAVEN VALIDATION
      # ============================================================

      - name: Run root Maven tests when root pom exists
        id: p3_root_maven
        shell: bash
        run: |
          set -euo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          if [[ -f pom.xml ]]; then
            mvn -B -ntp clean test \
              2>&1 | tee "${RAW}/root-maven.log"
          else
            echo "Root Maven project not present; not applicable." \
              | tee "${RAW}/root-maven.log"
          fi

          echo "P3_ROOT_MAVEN: PASS"

      - name: Run P3 Maven tests and compile Java benchmark classes
        id: p3_maven
        shell: bash
        run: |
          set -euo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          mvn -B -ntp \
            -f P3/pom.xml \
            clean test \
            2>&1 | tee "${RAW}/p3-maven.log"

          test -f P3/target/classes/hpc/csr/BenchmarkV3Runner.class
          test -f P3/target/classes/hpc/csr/BenchmarkV3ResultWriter.class

          echo "P3_MAVEN: PASS"

      # ============================================================
      # 6. V2 BENCHMARK — N = 1,000,000
      # ============================================================

      - name: Run canonical P3 V2 benchmark
        id: p3_benchmark_v2
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          chmod +x P3/results/run_benchmark.sh

          export RUN_ID="${P3_RUN_ID}"
          export SOURCE_COMMIT="${P3_SOURCE_COMMIT}"
          export P3_WORKFLOW_RUN_ID="${P3_WORKFLOW_RUN_ID}"

          export N="${N}"
          export WARMUP="${WARMUP}"
          export ITERATIONS="${ITERATIONS}"
          export THRESHOLD="${THRESHOLD}"
          export PARALLELISM="${PARALLELISM}"

          bash P3/results/run_benchmark.sh \
            2>&1 | tee "${RAW}/benchmark-v2-run.log"

          echo "P3_V2_BENCHMARK: PASS"

      - name: Verify V2 validation report belongs to this RUN_ID
        id: p3_benchmark_v2_validation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          run_id = os.environ["P3_RUN_ID"]
          raw = Path("P3/results/raw") / run_id

          csv_path = Path("P3/benchmarks/benchmark_results_v2.csv")
          report_path = raw / "validation-report.json"

          if not csv_path.is_file() or csv_path.is_symlink():
              raise SystemExit("V2 canonical CSV is missing or unsafe.")

          if not report_path.is_file() or report_path.is_symlink():
              raise SystemExit("V2 validation report is missing or unsafe.")

          report = json.loads(report_path.read_text(encoding="utf-8"))

          if report.get("schema") != "qflpn-benchmark-v2":
              raise SystemExit("V2 validation schema mismatch.")

          if report.get("validation") != "PASS":
              raise SystemExit("V2 validation did not PASS.")

          if report.get("all_records_valid") is not True:
              raise SystemExit("V2 records are not all valid.")

          latest = report.get("latest_record")
          if not isinstance(latest, dict):
              raise SystemExit("V2 latest_record is missing.")

          if latest.get("run_id") != run_id:
              raise SystemExit("V2 validation RUN_ID mismatch.")

          with csv_path.open(
              "r",
              encoding="utf-8-sig",
              newline="",
          ) as stream:
              reader = csv.DictReader(stream, strict=True)
              rows = [
                  row for row in reader
                  if row.get("run_id") == run_id
              ]

          if len(rows) != 1:
              raise SystemExit(
                  f"V2 expected exactly one row for {run_id}; got {len(rows)}"
              )

          row = rows[0]

          checks = {
              "dimension": int(os.environ["N"]),
              "warmup_iterations": int(os.environ["WARMUP"]),
              "measured_iterations": int(os.environ["ITERATIONS"]),
          }

          for key, expected in checks.items():
              if int(row[key]) != expected:
                  raise SystemExit(
                      f"V2 {key} mismatch: {row[key]} != {expected}"
                  )

          print("P3_V2_VALIDATION: PASS")
          PY

      # ============================================================
      # 7. V3 BENCHMARK — A/B MATRIX 192
      # ============================================================

      - name: Run BenchmarkV3Runner A/B matrix
        id: p3_benchmark_v3
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          export RUN_ID="${P3_RUN_ID}"
          export GITHUB_RUN_ID="${P3_WORKFLOW_RUN_ID}"
          export GITHUB_SHA="${P3_SOURCE_COMMIT}"

          export P3_V3_DIMENSION="${P3_V3_DIMENSION}"
          export P3_V3_WARMUP="${P3_V3_WARMUP}"
          export P3_V3_ITERATIONS="${P3_V3_ITERATIONS}"

          java \
            -cp P3/target/classes \
            hpc.csr.BenchmarkV3Runner \
            2>&1 | tee "${RAW}/benchmark-v3-run.log"

          grep -Fq "P3_V3_EXPECTED_CONFIGURATIONS=192" \
            "${RAW}/benchmark-v3-run.log"

          grep -Fq "P3_V3_COMPLETED_CONFIGURATIONS=192" \
            "${RAW}/benchmark-v3-run.log"

          grep -Fq "P3_V3_FAILED_CONFIGURATIONS=0" \
            "${RAW}/benchmark-v3-run.log"

          grep -Fq "P3_V3_AB_MATRIX_COMPLETE" \
            "${RAW}/benchmark-v3-run.log"

          echo "P3_V3_BENCHMARK: PASS — 192/192"

      - name: Validate V3 CSV and write authoritative JSON report
        id: p3_benchmark_v3_validation
        shell: bash
        run: |
          set -euo pipefail

          python P3/results/validate_benchmark_v3.py \
            --csv P3/benchmarks/benchmark_results_v3.csv \
            --run-id "${P3_RUN_ID}" \
            --workflow-run-id "${P3_WORKFLOW_RUN_ID}" \
            --commit-sha "${P3_SOURCE_COMMIT}" \
            --report-json P3/reports/benchmark-v3-validation.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("P3/reports/benchmark-v3-validation.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          required = {
              "schema": "qflpn-benchmark-v3-validation-v2",
              "validation": "PASS",
              "all_records_valid": True,
              "configuration_matrix_complete": True,
              "run_contract": "AB_192",
              "expected_records": 192,
              "validated_records": 192,
          }

          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(
                      f"V3 report mismatch for {key}: "
                      f"{report.get(key)!r} != {expected!r}"
                  )

          if report.get("run_id") != os.environ["P3_RUN_ID"]:
              raise SystemExit("V3 report RUN_ID mismatch.")

          if report.get("workflow_run_id") != os.environ["P3_WORKFLOW_RUN_ID"]:
              raise SystemExit("V3 report workflow_run_id mismatch.")

          if report.get("commit_sha") != os.environ["P3_SOURCE_COMMIT"]:
              raise SystemExit("V3 report commit_sha mismatch.")

          policies = report.get("split_policies")
          if set(policies or []) != {
              "ROW_BOUNDARY_SCAN",
              "BINARY_NNZ_SPLIT",
          }:
              raise SystemExit("V3 A/B split policies are incomplete.")

          print("P3_V3_VALIDATION: PASS — 192/192")
          PY

      # ============================================================
      # 8. V3 CHECKSUM
      # ============================================================

      - name: Generate V3 canonical CSV checksum
        id: p3_v3_checksum
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          from pathlib import Path

          csv_path = Path("P3/benchmarks/benchmark_results_v3.csv")
          checksum_path = Path("P3/reports/benchmark-v3-SHA256SUMS.txt")

          if csv_path.is_symlink() or not csv_path.is_file():
              raise SystemExit("V3 canonical CSV is missing or unsafe.")

          digest = hashlib.sha256(csv_path.read_bytes()).hexdigest()

          checksum_path.parent.mkdir(parents=True, exist_ok=True)
          checksum_path.write_text(
              f"{digest}  benchmarks/benchmark_results_v3.csv\n",
              encoding="ascii",
          )

          print("P3_V3_CHECKSUM: PASS")
          PY

      # ============================================================
      # 9. PERSISTENT REPORTS AND ENVIRONMENT PROVENANCE
      # ============================================================

      - name: Persist V2 reports and execution environment
        id: p3_benchmark_summary
        shell: bash
        run: |
          set -euo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"

          for file in \
            benchmark-report.json \
            benchmark-report.txt \
            benchmark-report.md \
            validation-report.json \
            SHA256SUMS.txt
          do
            if [[ ! -s "${RAW}/${file}" || -L "${RAW}/${file}" ]]; then
              echo "::error::Missing or unsafe V2 report: ${file}"
              exit 1
            fi
          done

          cp "${RAW}/benchmark-report.json" \
            P3/reports/benchmark-report.json

          cp "${RAW}/benchmark-report.txt" \
            P3/reports/benchmark-report.txt

          cp "${RAW}/benchmark-report.md" \
            P3/reports/benchmark-report.md

          cp "${RAW}/validation-report.json" \
            P3/reports/validation-report.json

          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def output(*args):
              try:
                  return subprocess.check_output(
                      args,
                      text=True,
                      stderr=subprocess.STDOUT,
                  ).strip()
              except Exception as exc:
                  return f"UNAVAILABLE: {exc}"

          payload = {
              "schema": "qflpn-p3-environment-v1",
              "run_id": os.environ["P3_RUN_ID"],
              "repository": {
                  "commit": os.environ["P3_SOURCE_COMMIT"],
              },
              "workflow_run_id": os.environ["P3_WORKFLOW_RUN_ID"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "java": output("java", "-version"),
              "maven": output("mvn", "-version"),
              "v2": {
                  "dimension": int(os.environ["N"]),
                  "warmup": int(os.environ["WARMUP"]),
                  "iterations": int(os.environ["ITERATIONS"]),
                  "threshold": int(os.environ["THRESHOLD"]),
                  "parallelism": int(os.environ["PARALLELISM"]),
              },
              "v3": {
                  "dimension": int(os.environ["P3_V3_DIMENSION"]),
                  "warmup": int(os.environ["P3_V3_WARMUP"]),
                  "iterations": int(os.environ["P3_V3_ITERATIONS"]),
                  "expected_configurations": 192,
              },
          }

          reports = Path("P3/reports")
          reports.mkdir(parents=True, exist_ok=True)

          content = json.dumps(
              payload,
              indent=2,
              sort_keys=True,
              ensure_ascii=False,
              allow_nan=False,
          ) + "\n"

          (reports / "environment.json").write_text(
              content,
              encoding="utf-8",
          )

          raw = Path("P3/results/raw") / os.environ["P3_RUN_ID"]
          (raw / "environment.json").write_text(
              content,
              encoding="utf-8",
          )

          print("P3_ENVIRONMENT_REPORT: PASS")
          PY

      # ============================================================
      # 10. CROSS-EVIDENCE CONSISTENCY
      # ============================================================

      - name: Verify V2 and V3 evidence consistency
        id: p3_evidence_consistency
        shell: bash
        run: |
          set -euo pipefail

          python P3/tools/verify_evidence_consistency.py \
            --root . \
            --run-id "${P3_RUN_ID}" \
            --source-commit "${P3_SOURCE_COMMIT}" \
            --workflow-run-id "${P3_WORKFLOW_RUN_ID}" \
            --json-output P3/reports/evidence-consistency.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("P3/reports/evidence-consistency.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          if report.get("schema") != "qflpn-p3-evidence-consistency-v2":
              raise SystemExit("Evidence consistency schema mismatch.")

          if report.get("validation") != "PASS":
              raise SystemExit("Evidence consistency did not PASS.")

          evidence = report.get("evidence")
          if not isinstance(evidence, dict):
              raise SystemExit("Evidence consistency details are missing.")

          required = (
              "environment",
              "benchmark_v2",
              "benchmark_v3",
              "v3_authoritative_validator",
              "v3_persistent_report",
              "v3_checksums",
          )

          for item in required:
              if evidence.get(item) != "PASS":
                  raise SystemExit(
                      f"Evidence consistency failed: {item}"
                  )

          print("P3_EVIDENCE_CONSISTENCY: PASS")
          PY

      # ============================================================
      # 11. UPLOAD PRE-INTEGRITY EVIDENCE
      # ============================================================

      - name: Upload benchmark and validation evidence
        id: p3_artifact_upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p3-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            P3/reports/
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/results/run_benchmark.sh
            P3/benchmarks/benchmark_results_v2.csv
            P3/benchmarks/benchmark_results_v3.csv
            P3/target/surefire-reports/

      # ============================================================
      # 12. CI OUTCOMES — PRE-INTEGRITY STAGES
      # ============================================================

      - name: Record p3_validation stage outcomes
        id: p3_record_outcomes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["P3_RUN_ID"]
          raw = Path("P3/results/raw") / run_id

          if not raw.is_dir() or raw.is_symlink():
              raise SystemExit("RUN_ID evidence directory is missing or unsafe.")

          python_status = "${{ steps.p3_python_tests.outcome }}"

          stages = {
              "p3_environment": "${{ steps.p3_environment.outcome }}",
              "p3_required_files": "${{ steps.p3_required_files.outcome }}",
              "p3_python_compile": "${{ steps.p3_python_compile.outcome }}",
              "p3_benchmark_tests": python_status,
              "p3_manifest_tests": python_status,
              "p3_final_package_tests": python_status,
              "p3_python_tests": python_status,
              "p3_root_maven": "${{ steps.p3_root_maven.outcome }}",
              "p3_maven": "${{ steps.p3_maven.outcome }}",
              "p3_benchmark_v2": "${{ steps.p3_benchmark_v2.outcome }}",
              "p3_benchmark_v2_validation": "${{ steps.p3_benchmark_v2_validation.outcome }}",
              "p3_benchmark_v3": "${{ steps.p3_benchmark_v3.outcome }}",
              "p3_benchmark_v3_validation": "${{ steps.p3_benchmark_v3_validation.outcome }}",
              "p3_benchmark_summary": "${{ steps.p3_benchmark_summary.outcome }}",
              "p3_evidence_consistency": "${{ steps.p3_evidence_consistency.outcome }}",
              "p3_artifact_upload": "${{ steps.p3_artifact_upload.outcome }}",
          }

          required = (
              "p3_environment",
              "p3_required_files",
              "p3_python_compile",
              "p3_benchmark_tests",
              "p3_manifest_tests",
              "p3_final_package_tests",
              "p3_python_tests",
              "p3_root_maven",
              "p3_maven",
              "p3_benchmark_v2",
              "p3_benchmark_v2_validation",
              "p3_benchmark_v3",
              "p3_benchmark_v3_validation",
              "p3_benchmark_summary",
              "p3_evidence_consistency",
              "p3_artifact_upload",
          )

          if set(stages) != set(required):
              raise SystemExit("p3_validation stage inventory mismatch.")

          failed = {
              name: value
              for name, value in stages.items()
              if value != "success"
          }

          if failed:
              raise SystemExit(
                  "A required p3_validation stage did not succeed: "
                  + json.dumps(failed, sort_keys=True)
              )

          payload = {
              "schema": "qflpn-p3-ci-outcomes-v1",
              "run_id": run_id,
              "source_commit": os.environ["P3_SOURCE_COMMIT"],
              "workflow_run_id": os.environ["P3_WORKFLOW_RUN_ID"],
              "stages": stages,
          }

          path = raw / "ci-outcomes.json"

          if path.exists() or path.is_symlink():
              raise SystemExit(
                  "ci-outcomes.json already exists; refusing to overwrite."
              )

          path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )

          print("P3_CI_OUTCOMES: PASS")
          print(f"P3_CI_OUTCOMES_RUN_ID={run_id}")
          PY

      # ============================================================
      # 13. GLOBAL INTEGRITY GENERATION
      # ============================================================

      - name: Generate global MANIFEST.txt and SHA256SUMS.txt
        id: p3_integrity_generate
        shell: bash
        run: |
          set -euo pipefail

          python P3/tools/compute_checksums.py

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          if [[ -L P3/MANIFEST.txt || -L P3/SHA256SUMS.txt ]]; then
            echo "::error::Global integrity files must not be symlinks."
            exit 1
          fi

          echo "P3_INTEGRITY_GENERATION: PASS"

      # ============================================================
      # 14. INDEPENDENT INTEGRITY VERIFICATION
      # ============================================================

      - name: Independently verify global integrity inventory
        id: p3_integrity_verify
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "P3/tools")

          import verify_final_package

          result = verify_final_package.verify_global_integrity(
              Path(".")
          )

          if not isinstance(result, dict):
              raise SystemExit("Integrity verifier returned invalid result.")

          manifest_count = result.get("manifest_entries", 0)
          checksum_count = result.get("sha256_entries_verified", 0)

          if manifest_count <= 0:
              raise SystemExit("MANIFEST.txt is empty.")

          if checksum_count <= 0:
              raise SystemExit("SHA256SUMS.txt is empty.")

          if manifest_count != checksum_count:
              raise SystemExit("Manifest/checksum entry counts differ.")

          print("P3_GLOBAL_INTEGRITY: PASS")
          print(result)
          PY

      # ============================================================
      # 15. FINAL INDEPENDENT PACKAGE VERIFICATION
      # ============================================================

      - name: Run verify_final_package.py — P3_ACCEPTED gate
        id: p3_final_verification
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW="${P3_RAW_ROOT}/${P3_RUN_ID}"
          OUTPUT="${RUNNER_TEMP}/p3-final-package-verification.json"

          python P3/tools/verify_final_package.py \
            --root . \
            --run-id "${P3_RUN_ID}" \
            --source-commit "${P3_SOURCE_COMMIT}" \
            --workflow-run-id "${P3_WORKFLOW_RUN_ID}" \
            --outcomes-json "${RAW}/ci-outcomes.json" \
            --expected-n "${N}" \
            --warmup "${WARMUP}" \
            --iterations "${ITERATIONS}" \
            --threshold "${THRESHOLD}" \
            --parallelism "${PARALLELISM}" \
            | tee "${OUTPUT}"

          python - "${OUTPUT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))

          if result.get("verdict") != "P3_ACCEPTED":
              raise SystemExit("Final package verdict is not P3_ACCEPTED.")

          v2 = result.get("benchmark_v2")
          v3 = result.get("benchmark_v3")
          integrity = result.get("integrity")

          if not isinstance(v2, dict) or v2.get("validation") != "PASS":
              raise SystemExit("Final V2 verification did not PASS.")

          if not isinstance(v3, dict) or v3.get("validation") != "PASS":
              raise SystemExit("Final V3 verification did not PASS.")

          if v3.get("run_contract") != "AB_192":
              raise SystemExit("Final V3 contract is not AB_192.")

          if v3.get("validated_records") != 192:
              raise SystemExit("Final V3 validation is not 192/192.")

          if not isinstance(integrity, dict):
              raise SystemExit("Final integrity result is missing.")

          if integrity.get("manifest_entries", 0) <= 0:
              raise SystemExit("Final MANIFEST verification is empty.")

          if integrity.get("sha256_entries_verified", 0) <= 0:
              raise SystemExit("Final SHA256SUMS verification is empty.")

          print("P3_ACCEPTED")
          print("V2: PASS")
          print("V3: PASS — 192/192")
          print("Evidence consistency: PASS")
          print("MANIFEST.txt: PASS")
          print("SHA256SUMS.txt: PASS")
          print("p3_validation: PASS")
          PY

      # ============================================================
      # 16. FINAL COMPLETE ARTIFACT
      # ============================================================

      - name: Upload complete P3 validation package
        id: p3_final_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-validation-complete-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
            P3/results/run_benchmark.sh
            P3/benchmarks/benchmark_results_v2.csv
            P3/benchmarks/benchmark_results_v3.csv
            P3/reports/**/*.json
            P3/reports/**/*.txt
            P3/reports/**/*.md
            P3/reports/*.json
            P3/reports/*.txt
            P3/reports/*.md
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/target/surefire-reports/
            ${{ runner.temp }}/p3-final-package-verification.json

      # ============================================================
      # 17. AUTOMATIC GITHUB ACTIONS SUMMARY — DYNAMIC EVIDENCE INDEX
      # ============================================================

      - name: Publish P3 validation summary and automatic evidence index
        id: p3_publish_summary
        if: always()
        shell: bash
        env:
          FINAL_VERIFICATION_OUTCOME: ${{ steps.p3_final_verification.outcome }}
          FINAL_ARTIFACT_OUTCOME: ${{ steps.p3_final_artifact.outcome }}
          FINAL_ARTIFACT_URL: ${{ steps.p3_final_artifact.outputs.artifact-url }}
        run: |
          set -Eeuo pipefail

          SUMMARY="${GITHUB_STEP_SUMMARY}"
          RAW="P3/results/raw/${P3_RUN_ID}"

          if [[ "${FINAL_VERIFICATION_OUTCOME}" == "success" ]]; then
            VERDICT="P3_ACCEPTED"
          else
            VERDICT="NOT_ACCEPTED"
          fi

          {
            echo "# P3 — Validation and complete evidence index"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow job | \`p3_validation\` |"
            echo "| Run ID | \`${P3_RUN_ID}\` |"
            echo "| Workflow run | \`${P3_WORKFLOW_RUN_ID:-${GITHUB_RUN_ID}}\` |"
            echo "| Source commit | \`${P3_SOURCE_COMMIT:-${GITHUB_SHA}}\` |"
            echo "| Final verification outcome | \`${FINAL_VERIFICATION_OUTCOME}\` |"
            echo "| Final artifact outcome | \`${FINAL_ARTIFACT_OUTCOME}\` |"
            echo "| Final verdict | **${VERDICT}** |"
            echo
            echo "## Complete downloadable evidence"
            echo
          } >> "${SUMMARY}"

          if [[ -n "${FINAL_ARTIFACT_URL:-}" ]]; then
            echo "[Open complete P3 validation artifact](${FINAL_ARTIFACT_URL})" \
              >> "${SUMMARY}"
          else
            echo "The final artifact URL is not available for this execution." \
              >> "${SUMMARY}"
          fi

          {
            echo
            echo "## Automatic file inventory"
            echo
            echo "The following index is generated from files actually present at runtime."
            echo
          } >> "${SUMMARY}"

          declare -a INVENTORY=()
          declare -A SEEN=()

          add_file() {
            local file="$1"

            if [[ -f "${file}" && ! -L "${file}" ]]; then
              if [[ -z "${SEEN[${file}]+present}" ]]; then
                INVENTORY+=("${file}")
                SEEN["${file}"]=1
              fi
            fi
          }

          add_tree() {
            local directory="$1"

            if [[ -d "${directory}" && ! -L "${directory}" ]]; then
              while IFS= read -r -d '' file; do
                add_file "${file}"
              done < <(
                find "${directory}" \
                  -type f \
                  ! -type l \
                  -print0 |
                  LC_ALL=C sort -z
              )
            fi
          }

          # Canonical package and benchmark files.
          add_file "P3/MANIFEST.txt"
          add_file "P3/SHA256SUMS.txt"
          add_file "P3/results/run_benchmark.sh"
          add_file "P3/benchmarks/benchmark_results_v2.csv"
          add_file "P3/benchmarks/benchmark_results_v3.csv"

          # All generated reports and run-specific evidence.
          add_tree "P3/reports"
          add_tree "${RAW}"
          add_tree "P3/target/surefire-reports"

          # Include the final verifier output when it exists.
          add_file "${RUNNER_TEMP}/p3-final-package-verification.json"

          if [[ "${#INVENTORY[@]}" -eq 0 ]]; then
            {
              echo "No evidence files were found by the automatic inventory."
              echo
              echo "Check the preceding workflow steps and artifact upload."
            } >> "${SUMMARY}"
          else
            {
              echo "| No. | File | Size (bytes) |"
              echo "|---:|---|---:|"
            } >> "${SUMMARY}"

            index=0

            for file in "${INVENTORY[@]}"; do
              index=$((index + 1))
              size="$(wc -c < "${file}")"
              printf '| %s | `%s` | %s |\n' \
                "${index}" "${file}" "${size}" >> "${SUMMARY}"
            done

            {
              echo
              echo "**Total indexed files:** ${#INVENTORY[@]}"
              echo
            } >> "${SUMMARY}"
          fi

          append_preview() {
            local file="$1"
            local limit="${2:-60}"
            local line_count

            {
              echo "### ${file}"
              echo
            } >> "${SUMMARY}"

            if [[ ! -f "${file}" || -L "${file}" ]]; then
              {
                echo "File not available in this execution."
                echo
              } >> "${SUMMARY}"
              return 0
            fi

            line_count="$(wc -l < "${file}")"

            {
              echo '```text'
              sed -n "1,${limit}p" "${file}"
              if [[ "${line_count}" -gt "${limit}" ]]; then
                echo
                echo "[Preview limited to ${limit} lines. The complete file is in the artifact.]"
              fi
              echo '```'
              echo
            } >> "${SUMMARY}"
          }

          {
            echo "## Automatic content previews"
            echo
            echo "Previews are generated only for text files found in the inventory."
            echo "Each preview is limited to 60 lines; complete files remain in the artifact."
            echo
          } >> "${SUMMARY}"

          for file in "${INVENTORY[@]}"; do
            case "${file}" in
              *.json|*.txt|*.md|*.csv|*.xml|*.log|*.sh)
                append_preview "${file}" 60
                ;;
            esac
          done

          {
            echo "## Integrity chain"
            echo
            echo "1. \`compute_checksums.py\` generates the global package inventory."
            echo "2. \`P3/MANIFEST.txt\` records the package files."
            echo "3. \`P3/SHA256SUMS.txt\` records the SHA-256 digests."
            echo "4. \`verify_global_integrity()\` independently verifies the inventory and digests."
            echo "5. \`verify_final_package.py\` evaluates the complete P3 package."
            echo
            echo "## Final execution status"
            echo
            echo "- Final verifier: \`${FINAL_VERIFICATION_OUTCOME}\`"
            echo "- Final artifact upload: \`${FINAL_ARTIFACT_OUTCOME}\`"
            echo "- Final verdict: **${VERDICT}**"
            echo "- Workflow job: \`p3_validation\`"
            echo
            echo "---"
            echo "P3 automatic evidence index generation completed."
          } >> "${SUMMARY}"

          echo "P3_GITHUB_STEP_SUMMARY: PUBLISHED"
          echo "P3_SUMMARY_INDEXED_FILES=${#INVENTORY[@]}"
