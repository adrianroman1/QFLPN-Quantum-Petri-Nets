name: P3 Complete Validation and Reproducibility

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "P3/**"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/p3-validation.yml"

# Required for p3_integrity_persist to commit the generated integrity files.
# GitHub branch protection can still reject the push; that must fail the job.
permissions:
  contents: write

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3_validation:
    name: P3 Complete Mathematical, Software and Integrity Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      P3_ROOT: P3
      N: "1000000"
      WARMUP: "5"
      ITERATIONS: "10"
      THRESHOLD: "4096"
      PARALLELISM: "2"
      RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ========================================================
      # 1. CHECKOUT AND ENVIRONMENT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Record P3 execution environment
        id: p3_environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports

          {
            echo "QFLPN P3 EXECUTION ENVIRONMENT"
            echo
            echo "UTC:"
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo
            echo "Repository:"
            git remote get-url origin
            echo
            echo "Branch:"
            echo "${GITHUB_REF_NAME:-unknown}"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Workflow:"
            echo "${GITHUB_WORKFLOW:-unknown}"
            echo
            echo "Run ID:"
            echo "${GITHUB_RUN_ID:-unknown}"
            echo
            echo "Run attempt:"
            echo "${GITHUB_RUN_ATTEMPT:-unknown}"
            echo
            echo "P3 benchmark RUN_ID:"
            echo "$RUN_ID"
            echo
            echo "Java:"
            java -version
            echo
            echo "Maven:"
            mvn --version
            echo
            echo "Python:"
            python --version
            echo
            echo "Pytest:"
            python -m pytest --version
            echo
            echo "Operating system:"
            uname -a
            echo
            echo "CPU:"
            lscpu
            echo
            echo "Memory:"
            free -h
            echo
            echo "Benchmark configuration:"
            echo "N=$N"
            echo "WARMUP=$WARMUP"
            echo "ITERATIONS=$ITERATIONS"
            echo "THRESHOLD=$THRESHOLD"
            echo "PARALLELISM=$PARALLELISM"
            echo
            echo "Python packages:"
            python -m pip freeze
          } > P3/reports/environment.txt 2>&1

          test -s P3/reports/environment.txt
          echo "P3_ENVIRONMENT_CAPTURED"

      # ========================================================
      # 2. REQUIRED P3 FILES
      # ========================================================

      - name: Validate required P3 source and validation files
        id: p3_required_files
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "P3/pom.xml",
              "P3/ACCEPTANCE_CHECKLIST.md",
              "P3/ACCEPTANCE_REPORT.md",
              "P3/INTEGRITY.md",
              "P3/P3_AUDIT_REPORT.md",
              "P3/VALIDATION_ALIGNMENT.md",
              "P3/VALIDATION_PROTOCOL.md",

              "P3/results/run_benchmark.sh",
              "P3/results/validate_benchmark.py",
              "P3/results/test_validate_benchmark.py",
              "P3/results/generate_benchmark_summary.py",

              "P3/tools/compute_checksums.py",
              "P3/tools/verify_final_package.py",
              "P3/tools/write_github_summary.py",

              "P3/tests/test_compute_checksums.py",
              "P3/tests/test_verify_final_package.py",
              "P3/tests/test_write_github_summary.py",
          ]

          missing = [
              item for item in required
              if not Path(item).is_file()
          ]

          if missing:
              print("P3_REQUIRED_FILES_FAILED")
              for item in missing:
                  print("MISSING:", item)
              sys.exit(1)

          print("P3_REQUIRED_FILES_ACCEPTED")
          PY

      - name: Validate P3 benchmark runner syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f P3/results/run_benchmark.sh
          bash -n P3/results/run_benchmark.sh
          echo "P3_BENCHMARK_RUNNER_SYNTAX_ACCEPTED"

      # ========================================================
      # 3. PYTHON SYNTAX VALIDATION
      # ========================================================

      - name: Compile all P3 Python validation scripts
        id: p3_python_compile
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/compute_checksums.py \
            P3/tools/verify_final_package.py \
            P3/tools/write_github_summary.py \
            P3/tests/test_compute_checksums.py \
            P3/tests/test_verify_final_package.py \
            P3/tests/test_write_github_summary.py

          python -m compileall -q \
            P3/results \
            P3/tools \
            P3/tests

          echo "P3_PYTHON_COMPILATION_ACCEPTED"

      # ========================================================
      # 4. PYTHON UNIT AND INTEGRITY TESTS
      # ========================================================

      - name: Run P3 benchmark validator tests
        id: p3_benchmark_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/results/test_validate_benchmark.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/benchmark-validator-tests.log

      - name: Run P3 P1-style checksum generator tests
        id: p3_manifest_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/tests/test_compute_checksums.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/manifest-generator-tests.log

      - name: Run P3 final package verifier tests
        id: p3_final_package_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/tests/test_verify_final_package.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/final-package-verifier-tests.log

      - name: Run complete P3 Python validation test suite
        id: p3_python_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_compute_checksums.py \
            P3/tests/test_verify_final_package.py \
            P3/tests/test_write_github_summary.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/python-validation-tests.log

      # ========================================================
      # 5. ROOT PROJECT MAVEN VALIDATION
      # ========================================================

      - name: Run root Maven clean test
        id: p3_root_maven
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn -B clean test \
            2>&1 | tee P3/reports/root-maven-validation.log

      # ========================================================
      # 6. P3 JAVA TESTS AND BENCHMARK
      # ========================================================

      - name: Run complete P3 Maven, CSR benchmark and V2 validation
        id: p3_benchmark
        shell: bash
        run: |
          set -Eeuo pipefail

          export N
          export WARMUP
          export ITERATIONS
          export THRESHOLD
          export PARALLELISM
          export RUN_ID

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/p3-benchmark-execution.log

          test -s P3/benchmarks/benchmark_results_v2.csv

          test -s "P3/results/raw/$RUN_ID/validation-report.json"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.txt"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.md"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.json"
          test -s "P3/results/raw/$RUN_ID/SHA256SUMS.txt"

          echo "P3_BENCHMARK_AND_V2_VALIDATION_ACCEPTED"

      # ========================================================
      # 7. CROSS-VALIDATE CSV AND JSON REPORT
      # ========================================================

      - name: Generate P3 benchmark evidence summary
        id: p3_benchmark_summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          REPORT="P3/results/raw/$RUN_ID/validation-report.json"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          {
            echo "## P3 benchmark evidence"
            echo
            echo "- RUN_ID: \`$RUN_ID\`"
            echo "- CSV: \`$CSV\`"
            echo "- Validation report: \`$REPORT\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$REPORT" ] || [ ! -s "$CSV" ]; then
            {
              echo "**UNAVAILABLE — benchmark evidence was not generated.**"
              echo
              echo "The benchmark stage is evaluated independently by"
              echo "\`verify_final_package.py\`."
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            echo "P3_BENCHMARK_SUMMARY_UNAVAILABLE"
            exit 0
          fi

          python P3/results/generate_benchmark_summary.py \
            --csv "$CSV" \
            --report "$REPORT" \
            --output "$GITHUB_STEP_SUMMARY" \
            --run-id "$RUN_ID"

          echo "P3_BENCHMARK_SUMMARY_GENERATED"

      # ========================================================
      # 8. GLOBAL P3 INTEGRITY GENERATION
      # ========================================================

      - name: Generate P1-style P3 MANIFEST and SHA256SUMS
        id: p3_integrity_generate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/compute_checksums.py

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "P3_P1_STYLE_MANIFEST_AND_SHA256SUMS_GENERATED"

      # ========================================================
      # 9. PERSIST INTEGRITY FILES IN THE REPOSITORY
      #
      # This is the actual repository write stage.
      # It commits ONLY the two global integrity files.
      # Pull requests are intentionally read-only.
      # ========================================================

      - name: Persist P3 MANIFEST and SHA256SUMS in repository
        id: p3_integrity_persist
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.p3_integrity_generate.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          if [ -z "${GITHUB_REF_NAME:-}" ]; then
            echo "P3_INTEGRITY_PERSIST_FAILED: branch name is unavailable" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "P3_INTEGRITY_PERSIST_FAILED: refusing non-branch ref" >&2
            echo "GITHUB_REF=$GITHUB_REF" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the two generated integrity files.
          git add -- P3/MANIFEST.txt P3/SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "P3_INTEGRITY_FILES_ALREADY_CURRENT"
          else
            git commit \
              -m "chore(p3): persist generated integrity manifests"

            # A protected branch may reject this push. Do not hide that failure.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # Verify that the remote branch contains exactly the generated blobs.
          git fetch origin "$GITHUB_REF_NAME"

          LOCAL_MANIFEST="$(git hash-object P3/MANIFEST.txt)"
          REMOTE_MANIFEST="$(git rev-parse "FETCH_HEAD:P3/MANIFEST.txt")"

          LOCAL_SHA256="$(git hash-object P3/SHA256SUMS.txt)"
          REMOTE_SHA256="$(git rev-parse "FETCH_HEAD:P3/SHA256SUMS.txt")"

          if [ "$LOCAL_MANIFEST" != "$REMOTE_MANIFEST" ]; then
            echo "P3_INTEGRITY_PERSIST_FAILED: remote MANIFEST differs" >&2
            exit 1
          fi

          if [ "$LOCAL_SHA256" != "$REMOTE_SHA256" ]; then
            echo "P3_INTEGRITY_PERSIST_FAILED: remote SHA256SUMS differs" >&2
            exit 1
          fi

          echo "P3_INTEGRITY_FILES_PERSISTED_AND_REMOTE_VERIFIED"
          echo "P3_MANIFEST_BLOB=$REMOTE_MANIFEST"
          echo "P3_SHA256SUMS_BLOB=$REMOTE_SHA256"

      # ========================================================
      # 10. INDIVIDUAL MANIFEST PUBLICATION
      # ========================================================

      - name: Verify and publish complete P3 MANIFEST.txt
        id: p3_display_manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("P3/MANIFEST.txt")

          if not path.is_file() or path.is_symlink():
              raise SystemExit("P3_MANIFEST_MISSING_OR_UNSAFE")

          raw = path.read_bytes()

          try:
              content = raw.decode("utf-8")
          except UnicodeError as exc:
              raise SystemExit(f"P3_MANIFEST_NOT_UTF8: {exc}")

          if not content.endswith("\n"):
              raise SystemExit("P3_MANIFEST_MISSING_FINAL_NEWLINE")

          entries = content.splitlines()

          if not entries or any(not entry for entry in entries):
              raise SystemExit("P3_MANIFEST_EMPTY_OR_BLANK_ENTRY")

          if entries != sorted(entries):
              raise SystemExit("P3_MANIFEST_ENTRIES_NOT_SORTED")

          if len(entries) != len(set(entries)):
              raise SystemExit("P3_MANIFEST_ENTRIES_NOT_UNIQUE")

          for entry in entries:
              candidate = Path(entry)

              if (
                  candidate.is_absolute()
                  or "\\" in entry
                  or ".." in candidate.parts
                  or not entry.startswith("P3/")
                  or entry.strip() != entry
                  or candidate.name in {"MANIFEST.txt", "SHA256SUMS.txt"}
              ):
                  raise SystemExit(f"P3_MANIFEST_UNSAFE_ENTRY: {entry}")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as stream:
              stream.write("# P3 — MANIFEST.txt (complete publication)\n\n")
              stream.write("- Format: P1-compatible, paths only\n")
              stream.write(f"- Entries: {len(entries)}\n")
              stream.write(f"- Published bytes: {len(raw)}\n\n")
              stream.write("~~~text\n")
              stream.write(content)
              stream.write("~~~\n\n")

          print("P3_MANIFEST_VALIDATED_AND_PUBLISHED")
          print(f"P3_MANIFEST_ENTRIES={len(entries)}")
          PY

      # ========================================================
      # 11. INDIVIDUAL SHA256SUMS PUBLICATION
      # ========================================================

      - name: Verify and publish complete P3 SHA256SUMS.txt
        id: p3_display_sha256
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("P3/SHA256SUMS.txt")

          if not path.is_file() or path.is_symlink():
              raise SystemExit("P3_SHA256SUMS_MISSING_OR_UNSAFE")

          raw = path.read_bytes()

          try:
              content = raw.decode("ascii")
          except UnicodeError as exc:
              raise SystemExit(f"P3_SHA256SUMS_NOT_ASCII: {exc}")

          if not content.endswith("\n"):
              raise SystemExit("P3_SHA256SUMS_MISSING_FINAL_NEWLINE")

          entries = {}

          for number, line in enumerate(content.splitlines(), start=1):
              match = re.fullmatch(r"([0-9a-f]{64})  ([^\r\n]+)", line)

              if not match:
                  raise SystemExit(
                      f"P3_SHA256SUMS_INVALID_LINE_{number}"
                  )

              digest, name = match.groups()
              candidate = Path(name)

              if (
                  candidate.is_absolute()
                  or "\\" in name
                  or ".." in candidate.parts
                  or not name.startswith("P3/")
                  or name.strip() != name
                  or candidate.name in {"MANIFEST.txt", "SHA256SUMS.txt"}
              ):
                  raise SystemExit(
                      f"P3_SHA256SUMS_UNSAFE_PATH_LINE_{number}"
                  )

              if name in entries:
                  raise SystemExit(
                      f"P3_SHA256SUMS_DUPLICATE_PATH: {name}"
                  )

              entries[name] = digest

          if not entries:
              raise SystemExit("P3_SHA256SUMS_EMPTY")

          if list(entries) != sorted(entries):
              raise SystemExit("P3_SHA256SUMS_ENTRIES_NOT_SORTED")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as stream:
              stream.write("# P3 — SHA256SUMS.txt (complete publication)\n\n")
              stream.write("- Format: GNU SHA-256, P1-compatible\n")
              stream.write("- MANIFEST.txt is not self-included\n")
              stream.write(f"- Checksum entries: {len(entries)}\n")
              stream.write(f"- Published bytes: {len(raw)}\n\n")
              stream.write("~~~text\n")
              stream.write(content)
              stream.write("~~~\n\n")

          print("P3_SHA256SUMS_FORMAT_VALIDATED_AND_PUBLISHED")
          print(f"P3_SHA256SUMS_ENTRIES={len(entries)}")
          PY

      # ========================================================
      # 12. AUTOMATIC DISCOVERY AND FULL DISPLAY
      #     EXCLUDING SEPARATELY PUBLISHED INTEGRITY FILES
      # ========================================================

      - name: Discover and display P3 MD CSV TXT files without duplicates
        id: p3_display_all_text
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import os

          root = Path("P3").resolve()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          extensions = {".md", ".csv", ".txt"}

          manifest = root / "MANIFEST.txt"
          checksums = root / "SHA256SUMS.txt"

          for path in (manifest, checksums):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      f"P3_REQUIRED_INTEGRITY_FILE_MISSING: {path.name}"
                  )

          excluded = {
              "MANIFEST.txt",
              "SHA256SUMS.txt",
          }

          files = sorted(
              (
                  path for path in root.rglob("*")
                  if path.is_file()
                  and not path.is_symlink()
                  and path.suffix.lower() in extensions
                  and path.name not in excluded
                  and "target" not in path.relative_to(root).parts
              ),
              key=lambda path: path.relative_to(root).as_posix().lower()
          )

          output = [
              "# QFLPN P3 — COMPLETE AUTOMATIC TEXT FILE PUBLICATION",
              "",
              f"Discovered files: **{len(files)}**",
              "",
              "Extensions: `.md`, `.csv`, `.txt`",
              "",
              "MANIFEST.txt and SHA256SUMS.txt are published separately above.",
              "",
          ]

          read_errors = []

          for path in files:
              relative = path.relative_to(root).as_posix()

              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError) as exc:
                  read_errors.append(f"{relative}: {exc}")
                  output.extend([
                      f"## FILE: `P3/{relative}`",
                      "",
                      f"**READ ERROR: {exc}**",
                      "",
                  ])
                  continue

              longest = max(
                  (
                      len(line) - len(line.lstrip("`"))
                      for line in content.splitlines()
                      if line and set(line.strip()) == {"`"}
                  ),
                  default=0,
              )

              fence = "`" * max(3, longest + 1)

              output.extend([
                  f"## FILE: `P3/{relative}`",
                  "",
                  f"{fence}text",
                  content,
                  fence,
                  "",
              ])

          rendered = "\n".join(output)
          encoded = rendered.encode("utf-8")

          if len(encoded) > 950_000:
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write(
                      "# P3 COMPLETE TEXT DISPLAY FAILED\n\n"
                      f"Discovered files: {len(files)}\n\n"
                      f"Required display size: {len(encoded)} bytes\n\n"
                      "The complete source files remain in the workflow "
                      "artifact. The summary was not truncated.\n"
                  )

              raise SystemExit(
                  "P3_TEXT_DISPLAY_EXCEEDS_GITHUB_SUMMARY_LIMIT"
              )

          with summary.open("a", encoding="utf-8") as stream:
              stream.write(rendered)

          print("P3_AUTOMATIC_TEXT_FILE_DISCOVERY_ACCEPTED")
          print(f"P3_TEXT_FILES_DISCOVERED={len(files)}")
          print(f"P3_TEXT_DISPLAY_BYTES={len(encoded)}")

          if read_errors:
              raise SystemExit(
                  "P3_TEXT_FILE_READ_ERRORS: " + "; ".join(read_errors)
              )

          print("P3_MANIFEST_AND_SHA256SUMS_PUBLISHED_SEPARATELY")
          print("P3_ALL_OTHER_MD_CSV_TXT_FILES_DISPLAYED")
          PY

      # ========================================================
      # 13. PUBLISH COMPLETE VALIDATION ARTIFACTS
      # ========================================================

      - name: Upload complete P3 validation evidence
        id: p3_artifact_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3-complete-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            P3/

      # ========================================================
      # 14. FINAL INDEPENDENT PACKAGE VERIFICATION
      # ========================================================

      - name: Independently verify complete P3 package and publish verdict
        id: p3_final_verdict
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          P3_ENVIRONMENT: ${{ steps.p3_environment.outcome }}
          P3_REQUIRED_FILES: ${{ steps.p3_required_files.outcome }}
          P3_PYTHON_COMPILE: ${{ steps.p3_python_compile.outcome }}
          P3_BENCHMARK_TESTS: ${{ steps.p3_benchmark_tests.outcome }}
          P3_MANIFEST_TESTS: ${{ steps.p3_manifest_tests.outcome }}
          P3_FINAL_PACKAGE_TESTS: ${{ steps.p3_final_package_tests.outcome }}
          P3_PYTHON_TESTS: ${{ steps.p3_python_tests.outcome }}
          P3_ROOT_MAVEN: ${{ steps.p3_root_maven.outcome }}
          P3_BENCHMARK: ${{ steps.p3_benchmark.outcome }}
          P3_BENCHMARK_SUMMARY: ${{ steps.p3_benchmark_summary.outcome }}
          P3_INTEGRITY_GENERATE: ${{ steps.p3_integrity_generate.outcome }}
          P3_INTEGRITY_PERSIST: ${{ steps.p3_integrity_persist.outcome }}
          P3_DISPLAY_MANIFEST: ${{ steps.p3_display_manifest.outcome }}
          P3_DISPLAY_SHA256: ${{ steps.p3_display_sha256.outcome }}
          P3_DISPLAY_ALL_TEXT: ${{ steps.p3_display_all_text.outcome }}
          P3_ARTIFACT_UPLOAD: ${{ steps.p3_artifact_upload.outcome }}
        run: |
          set -Eeuo pipefail

          OUTCOMES_JSON="$RUNNER_TEMP/p3-ci-outcomes.json"
          VERDICT_JSON="$RUNNER_TEMP/p3-final-verdict.json"

          export OUTCOMES_JSON

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mapping = {
              "p3_environment": "P3_ENVIRONMENT",
              "p3_required_files": "P3_REQUIRED_FILES",
              "p3_python_compile": "P3_PYTHON_COMPILE",
              "p3_benchmark_tests": "P3_BENCHMARK_TESTS",
              "p3_manifest_tests": "P3_MANIFEST_TESTS",
              "p3_final_package_tests": "P3_FINAL_PACKAGE_TESTS",
              "p3_python_tests": "P3_PYTHON_TESTS",
              "p3_root_maven": "P3_ROOT_MAVEN",
              "p3_benchmark": "P3_BENCHMARK",
              "p3_benchmark_summary": "P3_BENCHMARK_SUMMARY",
              "p3_integrity_generate": "P3_INTEGRITY_GENERATE",
              "p3_integrity_persist": "P3_INTEGRITY_PERSIST",
              "p3_display_manifest": "P3_DISPLAY_MANIFEST",
              "p3_display_sha256": "P3_DISPLAY_SHA256",
              "p3_display_all_text": "P3_DISPLAY_ALL_TEXT",
              "p3_artifact_upload": "P3_ARTIFACT_UPLOAD",
          }

          outcomes = {
              stage: os.environ.get(variable, "")
              for stage, variable in mapping.items()
          }

          path = Path(os.environ["OUTCOMES_JSON"])
          path.write_text(
              json.dumps(outcomes, indent=2) + "\n",
              encoding="utf-8",
          )

          print("P3_CI_OUTCOMES_CAPTURED")
          print(json.dumps(outcomes, indent=2))
          PY

          # Persistence is mandatory for push and workflow_dispatch runs.
          # PR runs are intentionally read-only and do not attempt a push.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            if [ "$P3_INTEGRITY_PERSIST" != "success" ]; then
              echo "P3_FINAL_VERDICT_REJECTED: integrity files were not persisted" >&2
              exit 1
            fi

            test -s P3/MANIFEST.txt
            test -s P3/SHA256SUMS.txt
          fi

          set +e
          python3 P3/tools/verify_final_package.py \
            --root . \
            --run-id "$RUN_ID" \
            --outcomes-json "$OUTCOMES_JSON" \
            --expected-n "$N" \
            --warmup "$WARMUP" \
            --iterations "$ITERATIONS" \
            --threshold "$THRESHOLD" \
            --parallelism "$PARALLELISM" \
            | tee "$VERDICT_JSON"

          verifier_status=${PIPESTATUS[0]}
          set -e

          if [ ! -s "$VERDICT_JSON" ]; then
            echo "P3_FINAL_VERDICT_JSON_MISSING" >&2
            exit 1
          fi

          python P3/tools/write_github_summary.py \
            --root . \
            --verdict-json "$VERDICT_JSON" \
            --run-id "$RUN_ID"

          if [ "$verifier_status" -ne 0 ]; then
            echo "P3_FINAL_VERDICT_REJECTED"
            exit "$verifier_status"
          fi

          echo "P3_FINAL_VERDICT_ACCEPTED"
          echo "**P3_FINAL_VERDICT: P3_ACCEPTED**" \
            >> "$GITHUB_STEP_SUMMARY"
