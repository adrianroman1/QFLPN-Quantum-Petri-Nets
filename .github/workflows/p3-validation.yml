name: P3 Validation — Complete Evidence and Integrity

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
  P3_N: "1000000"
  P3_WARMUP: "5"
  P3_ITERATIONS: "10"
  P3_THRESHOLD: "4096"
  P3_PARALLELISM: "2"

jobs:
  p3_validation:
    name: p3_validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==================================================
      # 1. CHECKOUT AND ENVIRONMENT
      # ==================================================

      - name: Checkout exact commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        id: python_dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Create P3 run directories and environment evidence
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports
          mkdir -p "P3/results/raw/${P3_RUN_ID}"

          {
            echo "QFLPN P3 VALIDATION ENVIRONMENT"
            echo "RUN_ID=${P3_RUN_ID}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "REF=${GITHUB_REF}"
            echo "EVENT=${GITHUB_EVENT_NAME}"
            echo "RUN=${GITHUB_RUN_ID}"
            echo "ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            java -version 2>&1
            echo
            mvn -version
            echo
            python --version
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
          } > P3/reports/environment.txt

          test -s P3/reports/environment.txt

      # ==================================================
      # 2. PREFLIGHT
      # CSV IS CREATED BY run_benchmark.sh
      # ==================================================

      - name: Preflight — verify all required files
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "pom.xml"
            "P3/pom.xml"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/test_validate_benchmark.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/generate_integrity.py"
            "P3/tools/verify_integrity.py"
            "P3/tests/test_generate_integrity.py"
            "P3/tests/test_verify_integrity.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          test -d P3/benchmarks
          test -d P3/results
          test -d P3/tests
          test -d P3/tools

          echo "[PASS] All required P3 directories exist."

      # ==================================================
      # 3. PYTHON COMPILATION
      # ==================================================

      - name: Compile P3 Python scripts and tests
        id: py_compile
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py

      # ==================================================
      # 4. ROOT MAVEN TESTS
      # ==================================================

      - name: Run root Maven tests
        id: root_maven
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn --batch-mode --no-transfer-progress test

      # ==================================================
      # 5. P3 MAVEN TESTS
      # ==================================================

      - name: Run P3 Maven tests
        id: p3_maven
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn --batch-mode --no-transfer-progress \
            -f P3/pom.xml test

      # ==================================================
      # 6. ALL P3 PYTHON TEST SUITES
      # ==================================================

      - name: Run benchmark and integrity Python tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest -q \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py \
            2>&1 | tee P3/reports/pytest-report.txt

      # ==================================================
      # 7. BENCHMARK EXECUTION
      # ==================================================

      - name: Execute P3 benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ env.P3_RUN_ID }}
          N: ${{ env.P3_N }}
          WARMUP: ${{ env.P3_WARMUP }}
          ITERATIONS: ${{ env.P3_ITERATIONS }}
          THRESHOLD: ${{ env.P3_THRESHOLD }}
          PARALLELISM: ${{ env.P3_PARALLELISM }}
        run: |
          set -Eeuo pipefail

          chmod +x P3/results/run_benchmark.sh

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/benchmark-execution.log

      # ==================================================
      # 8. EXACT RUN EVIDENCE VALIDATION
      # ==================================================

      - name: Validate benchmark RUN_ID and evidence
        id: benchmark_evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          required_files=(
            "$CSV"
            "${RUN_DIR}/benchmark-report.json"
            "${RUN_DIR}/benchmark-report.md"
            "${RUN_DIR}/benchmark-report.txt"
            "${RUN_DIR}/validation-report.json"
            "${RUN_DIR}/SHA256SUMS.txt"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty benchmark evidence: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          python - "$CSV" "$RUN_DIR" "$P3_RUN_ID" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          csv_path = Path(sys.argv[1])
          run_dir = Path(sys.argv[2])
          expected_run_id = sys.argv[3]

          report_path = run_dir / "validation-report.json"

          try:
              report = json.loads(
                  report_path.read_text(encoding="utf-8")
              )
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Cannot read validation report: {exc}")

          if not isinstance(report, dict):
              raise SystemExit("Validation report must be a JSON object")

          if report.get("schema") != "qflpn-benchmark-v2":
              raise SystemExit("Invalid benchmark schema")

          if report.get("validation") != "PASS":
              raise SystemExit("Benchmark validation is not PASS")

          if report.get("all_records_valid") is not True:
              raise SystemExit("Not all CSV records are confirmed valid")

          records = report.get("records")
          if not isinstance(records, int) or records < 1:
              raise SystemExit("Invalid benchmark record count")

          latest = report.get("latest_record")
          if not isinstance(latest, dict):
              raise SystemExit("Missing latest_record")

          if latest.get("run_id") != expected_run_id:
              raise SystemExit("JSON RUN_ID does not match workflow RUN_ID")

          try:
              with csv_path.open(
                  "r", encoding="utf-8-sig", newline=""
              ) as stream:
                  reader = csv.DictReader(stream, strict=True)

                  if not reader.fieldnames:
                      raise SystemExit("CSV header is missing")

                  if "run_id" not in reader.fieldnames:
                      raise SystemExit("CSV has no run_id column")

                  matching = [
                      row for row in reader
                      if row.get("run_id") == expected_run_id
                  ]

          except (OSError, UnicodeError, csv.Error) as exc:
              raise SystemExit(f"Cannot read CSV: {exc}")

          if len(matching) != 1:
              raise SystemExit(
                  "Expected exactly one CSV record for this RUN_ID; "
                  f"found {len(matching)}"
              )

          row = matching[0]

          try:
              csv_dimension = int(row["dimension"])
              csv_nnz = int(row["non_zero_count"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"Invalid CSV workload fields: {exc}")

          if csv_dimension != latest.get("dimension"):
              raise SystemExit("CSV/JSON dimension mismatch")

          if csv_nnz != latest.get("nnz"):
              raise SystemExit("CSV/JSON NNZ mismatch")

          print("[PASS] JSON schema.")
          print("[PASS] JSON validation status.")
          print("[PASS] JSON RUN_ID.")
          print("[PASS] Exactly one matching CSV record.")
          print("[PASS] CSV/JSON dimension and NNZ agreement.")
          PY

          (
            cd P3
            sha256sum --check \
              "results/raw/${P3_RUN_ID}/SHA256SUMS.txt"
          )

          echo "[PASS] Run-scoped SHA256SUMS.txt verified."

      # ==================================================
      # 9. BENCHMARK SUMMARY
      # ==================================================

      - name: Generate benchmark summary
        id: benchmark_summary
        if: always() && steps.benchmark_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f P3/reports/benchmark-summary.md

          python3 P3/results/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${P3_RUN_ID}/validation-report.json" \
            --run-id "${P3_RUN_ID}" \
            --output P3/reports/benchmark-summary.md

          test -s P3/reports/benchmark-summary.md

      # ==================================================
      # 10. FINAL P3 REPORTS
      # THESE FILES ARE NOT MODIFIED AFTER THIS STEP
      # ==================================================

      - name: Generate P3 validation and acceptance reports
        id: aggregate_reports
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("P3/reports")
          reports.mkdir(parents=True, exist_ok=True)

          gates = {
              "preflight": os.environ["PREFLIGHT_OUTCOME"],
              "python_compile": os.environ["PY_COMPILE_OUTCOME"],
              "root_maven": os.environ["ROOT_MAVEN_OUTCOME"],
              "p3_maven": os.environ["P3_MAVEN_OUTCOME"],
              "pytest_all_suites": os.environ["PYTEST_OUTCOME"],
              "benchmark_execution": os.environ["BENCHMARK_OUTCOME"],
              "exact_run_evidence": os.environ["EVIDENCE_OUTCOME"],
              "benchmark_summary": os.environ["SUMMARY_OUTCOME"],
          }

          passed = all(value == "success" for value in gates.values())

          summary = {
              "schema": "qflpn-p3-validation-summary-v2",
              "run_id": os.environ["P3_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "gates": gates,
              "pre_integrity_gates": "PASS" if passed else "FAIL",
              "integrity_report": "P3/MANIFEST.txt",
              "checksum_report": "P3/SHA256SUMS.txt",
              "final_verdict_location": "separate p3_validation artifact",
              "final_verdict_is_outside_p3": True,
          }

          acceptance = {
              "schema": "qflpn-p3-acceptance-v2",
              "run_id": summary["run_id"],
              "commit": summary["commit"],
              "pre_integrity_status": "PASS" if passed else "FAIL",
              "mandatory_pre_integrity_gates_passed": passed,
              "gates": gates,
              "final_integrity_verification": (
                  "EXECUTED IN SUBSEQUENT p3_validation GATE"
              ),
              "final_acceptance_verdict": (
                  "RECORDED IN SEPARATE CI ARTIFACT "
                  "TO PRESERVE P3 INTEGRITY"
              ),
          }

          (reports / "validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          (reports / "acceptance-report.json").write_text(
              json.dumps(acceptance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# QFLPN P3 — p3_validation",
              "",
              f"- Run ID: `{summary['run_id']}`",
              f"- Commit: `{summary['commit']}`",
              f"- Pre-integrity gates: **{summary['pre_integrity_gates']}**",
              "- Manifest: `P3/MANIFEST.txt`",
              "- Checksums: `P3/SHA256SUMS.txt`",
              "- Final verdict: recorded in separate CI artifact",
              "",
              "| Mandatory gate | Outcome |",
              "|---|---|",
          ]

          lines.extend(
              f"| {name} | {value.upper()} |"
              for name, value in gates.items()
          )

          lines.extend([
              "",
              "The P3 reports are finalized before global integrity generation.",
              "No file inside P3 is modified after MANIFEST.txt and "
              "SHA256SUMS.txt are generated.",
              "",
              "The final workflow verdict is published separately so that "
              "the P3 integrity inventory remains valid.",
              "",
          ])

          (reports / "validation-summary.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print("[PASS] P3 reports generated.")
          print("[INFO] Final integrity verdict will be recorded "
                "outside P3 after independent verification.")
          PY

          test -s P3/reports/validation-summary.json
          test -s P3/reports/acceptance-report.json
          test -s P3/reports/validation-summary.md

      # ==================================================
      # 11. FINAL MANIFEST AND SHA256 GENERATION
      # EXACTLY ONE GENERATION
      # ==================================================

      - name: Generate final P3 MANIFEST.txt and SHA256SUMS.txt
        id: integrity_generate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "[PASS] P3/MANIFEST.txt generated."
          echo "[PASS] P3/SHA256SUMS.txt generated."

      # ==================================================
      # 12. INDEPENDENT INTEGRITY VERIFICATION
      # NO P3 WRITES AFTER THIS STEP
      # ==================================================

      - name: Independently verify P3 integrity
        id: integrity_verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          python3 P3/tools/verify_integrity.py

          python3 P3/tools/generate_integrity.py --check

          echo "[PASS] Independent manifest verification."
          echo "[PASS] Independent SHA-256 verification."
          echo "[PASS] Deterministic integrity reproducibility."

      # ==================================================
      # 13. FINAL p3_validation GATE
      # FINAL VERDICT IS STORED OUTSIDE P3
      # ==================================================

      - name: Enforce final p3_validation acceptance
        id: final_gate
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PYTHON_DEPENDENCIES_OUTCOME: ${{ steps.python_dependencies.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
          REPORTS_OUTCOME: ${{ steps.aggregate_reports.outcome }}
          INTEGRITY_GENERATE_OUTCOME: ${{ steps.integrity_generate.outcome }}
          INTEGRITY_VERIFY_OUTCOME: ${{ steps.integrity_verify.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          names = [
              "CHECKOUT_OUTCOME",
              "JAVA_OUTCOME",
              "PYTHON_OUTCOME",
              "PYTHON_DEPENDENCIES_OUTCOME",
              "ENVIRONMENT_OUTCOME",
              "PREFLIGHT_OUTCOME",
              "PY_COMPILE_OUTCOME",
              "ROOT_MAVEN_OUTCOME",
              "P3_MAVEN_OUTCOME",
              "PYTEST_OUTCOME",
              "BENCHMARK_OUTCOME",
              "EVIDENCE_OUTCOME",
              "SUMMARY_OUTCOME",
              "REPORTS_OUTCOME",
              "INTEGRITY_GENERATE_OUTCOME",
              "INTEGRITY_VERIFY_OUTCOME",
          ]

          gates = {
              name: os.environ.get(name, "missing")
              for name in names
          }

          passed = all(value == "success" for value in gates.values())

          verdict = {
              "schema": "qflpn-p3-final-verdict-v1",
              "workflow": "p3_validation",
              "run_id": os.environ["P3_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "status": "PASS" if passed else "FAIL",
              "gates": gates,
              "integrity": {
                  "manifest": "P3/MANIFEST.txt",
                  "checksums": "P3/SHA256SUMS.txt",
                  "generation": gates["INTEGRITY_GENERATE_OUTCOME"],
                  "independent_verification": gates["INTEGRITY_VERIFY_OUTCOME"],
              },
          }

          verdict_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "p3-validation-final-verdict.json"
          )
          verdict_path.write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("========================================")
          print("P3 FINAL VALIDATION")
          print("========================================")
          print("JOB: p3_validation")
          print("RUN_ID:", verdict["run_id"])
          print("COMMIT:", verdict["commit"])

          for name, outcome in gates.items():
              print(f"{name}: {outcome}")

          print("FINAL STATUS:", verdict["status"])
          print("FINAL VERDICT:", verdict_path)

          if not passed:
              print("[FAIL] p3_validation")
              print(json.dumps(gates, indent=2))
              sys.exit(1)

          print("[PASS] p3_validation")
          print("[PASS] All mandatory gates succeeded.")
          print("[PASS] Final MANIFEST.txt and SHA256SUMS.txt verified.")
          print("[PASS] Final verdict written outside P3.")
          PY

      # ==================================================
      # 14. GITHUB STEP SUMMARY
      # ==================================================

      - name: Publish final p3_validation result
        if: always()
        shell: bash
        run: |
          {
            echo "## QFLPN P3 — p3_validation"
            echo
            echo "- Run ID: \`${P3_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Final gate: \`${{ steps.final_gate.outcome }}\`"
            echo "- Integrity generation: \`${{ steps.integrity_generate.outcome }}\`"
            echo "- Independent verification: \`${{ steps.integrity_verify.outcome }}\`"
            echo
            echo "### P3 integrity files"
            echo "- \`P3/MANIFEST.txt\`"
            echo "- \`P3/SHA256SUMS.txt\`"
            echo
            echo "### Run evidence"
            echo "- \`P3/results/raw/${P3_RUN_ID}/\`"
            echo
            echo "### P3 reports"
            echo "- \`P3/reports/\`"
            echo
            echo "### Final verdict"
            echo "The authoritative final verdict is included in the separate "
            echo "p3_validation-final-verdict artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # 15. UPLOAD P3 EVIDENCE
      # ==================================================

      - name: Upload complete P3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            P3/reports/
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/benchmarks/benchmark_results_v2.csv
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt

      # ==================================================
      # 16. UPLOAD AUTHORITATIVE FINAL VERDICT
      # OUTSIDE P3 — DOES NOT INVALIDATE P3 HASHES
      # ==================================================

      - name: Upload final p3_validation verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3_validation-final-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/p3-validation-final-verdict.json
