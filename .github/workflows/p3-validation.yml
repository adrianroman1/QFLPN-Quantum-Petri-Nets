name: P3 Validation — Complete Automated Evidence and Integrity

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
  P3_N: "1000000"
  P3_WARMUP: "5"
  P3_ITERATIONS: "10"
  P3_THRESHOLD: "4096"
  P3_PARALLELISM: "2"

jobs:
  p3_validation:
    name: p3_validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout exact commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # ==========================================================
      # 02. ENVIRONMENT
      # ==========================================================

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        id: python_dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest

      # ==========================================================
      # 03. CLEAN GENERATED OUTPUTS
      #
      # Remove stale reports and old global integrity files.
      # Preserve source code, historical benchmark CSV and old runs.
      # ==========================================================

      - name: Clean stale generated P3 outputs
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports
          mkdir -p P3/results/raw

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"

          case "$RUN_DIR" in
            P3/results/raw/p3-[0-9]*)
              rm -rf -- "$RUN_DIR"
              ;;
            *)
              echo "::error::Unsafe RUN_DIR: $RUN_DIR"
              exit 1
              ;;
          esac

          # Remove only generated report outputs.
          rm -f \
            P3/reports/environment.txt \
            P3/reports/pytest-report.txt \
            P3/reports/benchmark-execution.log \
            P3/reports/benchmark-summary.md \
            P3/reports/validation-summary.json \
            P3/reports/validation-summary.md \
            P3/reports/acceptance-report.json

          # Remove stale global integrity files before this run.
          rm -f \
            P3/MANIFEST.txt \
            P3/SHA256SUMS.txt

          # Initialize diagnostic outputs so later stages can report
          # failures even when tests or benchmark execution are skipped.
          printf '%s\n' "NOT_EXECUTED" \
            > P3/reports/pytest-report.txt

          printf '%s\n' "NOT_EXECUTED" \
            > P3/reports/benchmark-execution.log

          printf '%s\n' "NOT_EXECUTED" \
            > P3/reports/benchmark-summary.md

          mkdir -p "$RUN_DIR"

          echo "[PASS] Stale generated reports removed."
          echo "[PASS] Stale MANIFEST.txt removed."
          echo "[PASS] Stale SHA256SUMS.txt removed."
          echo "[PASS] Historical benchmark CSV preserved."
          echo "[PASS] Historical raw benchmark runs preserved."

      - name: Record P3 execution environment
        id: environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports
          mkdir -p "P3/results/raw/${P3_RUN_ID}"

          {
            echo "QFLPN P3 VALIDATION ENVIRONMENT"
            echo "WORKFLOW=p3_validation"
            echo "RUN_ID=${P3_RUN_ID}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "REF=${GITHUB_REF}"
            echo "EVENT=${GITHUB_EVENT_NAME}"
            echo "RUN=${GITHUB_RUN_ID}"
            echo "ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            java -version 2>&1
            echo
            mvn -version
            echo
            python --version
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
          } > P3/reports/environment.txt

          test -s P3/reports/environment.txt

      # ==========================================================
      # 04. PREFLIGHT
      #
      # CSV is generated by the benchmark and is NOT required here.
      # ==========================================================

      - name: Preflight — verify complete P3 source inventory
        id: preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "pom.xml"
            "P3/pom.xml"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/test_validate_benchmark.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/generate_integrity.py"
            "P3/tools/verify_integrity.py"
            "P3/tests/test_generate_integrity.py"
            "P3/tests/test_verify_integrity.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          required_directories=(
            "P3"
            "P3/benchmarks"
            "P3/results"
            "P3/results/raw"
            "P3/reports"
            "P3/tests"
            "P3/tools"
          )

          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Missing directory: $directory"
              exit 1
            fi
            echo "[PASS] $directory/"
          done

          echo "[PASS] P3 preflight completed."

      # ==========================================================
      # 05. PYTHON COMPILATION
      # ==========================================================

      - name: Compile all P3 Python scripts and tests
        id: py_compile
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py

          echo "[PASS] Python compilation."

      # ==========================================================
      # 06. ROOT MAVEN
      # ==========================================================

      - name: Run root Maven tests
        id: root_maven
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn --batch-mode --no-transfer-progress test

      # ==========================================================
      # 07. P3 MAVEN
      # ==========================================================

      - name: Run P3 Maven tests
        id: p3_maven
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn --batch-mode --no-transfer-progress \
            -f P3/pom.xml test

      # ==========================================================
      # 08. ALL PYTHON TEST SUITES
      # ==========================================================

      - name: Run all existing P3 Python test suites
        id: pytest
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest -v \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py \
            2>&1 | tee P3/reports/pytest-report.txt

      # ==========================================================
      # 09. BENCHMARK EXECUTION
      # ==========================================================

      - name: Execute P3 benchmark
        id: benchmark
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ env.P3_RUN_ID }}
          N: ${{ env.P3_N }}
          WARMUP: ${{ env.P3_WARMUP }}
          ITERATIONS: ${{ env.P3_ITERATIONS }}
          THRESHOLD: ${{ env.P3_THRESHOLD }}
          PARALLELISM: ${{ env.P3_PARALLELISM }}
        run: |
          set -Eeuo pipefail

          chmod +x P3/results/run_benchmark.sh

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/benchmark-execution.log

      # ==========================================================
      # 10. EXACT RUN EVIDENCE VALIDATION
      #
      # Validate CSV + JSON + RUN_ID + run-scoped SHA256.
      # ==========================================================

      - name: Validate exact benchmark RUN_ID and evidence
        id: benchmark_evidence
        if: always() && steps.benchmark.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          required_files=(
            "$CSV"
            "${RUN_DIR}/benchmark-report.json"
            "${RUN_DIR}/benchmark-report.md"
            "${RUN_DIR}/benchmark-report.txt"
            "${RUN_DIR}/validation-report.json"
            "${RUN_DIR}/SHA256SUMS.txt"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing benchmark evidence: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          python - "$CSV" "$RUN_DIR" "$P3_RUN_ID" <<'PY'
          import csv
          import json
          import math
          import sys
          from pathlib import Path

          csv_path = Path(sys.argv[1])
          run_dir = Path(sys.argv[2])
          expected_run_id = sys.argv[3]

          report_path = run_dir / "validation-report.json"

          try:
              report = json.loads(
                  report_path.read_text(encoding="utf-8")
              )
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Cannot read validation report: {exc}")

          if not isinstance(report, dict):
              raise SystemExit("Validation report must be a JSON object")

          if report.get("schema") != "qflpn-benchmark-v2":
              raise SystemExit("Invalid benchmark schema")

          if report.get("validation") != "PASS":
              raise SystemExit("Benchmark validation is not PASS")

          if report.get("all_records_valid") is not True:
              raise SystemExit("Not all CSV records are valid")

          records = report.get("records")
          if not isinstance(records, int) or records < 1:
              raise SystemExit("Invalid benchmark record count")

          latest = report.get("latest_record")
          if not isinstance(latest, dict):
              raise SystemExit("Missing latest_record")

          if latest.get("run_id") != expected_run_id:
              raise SystemExit("JSON RUN_ID mismatch")

          try:
              with csv_path.open(
                  "r", encoding="utf-8-sig", newline=""
              ) as stream:
                  reader = csv.DictReader(stream, strict=True)

                  if not reader.fieldnames:
                      raise SystemExit("CSV header is missing")

                  required_columns = {
                      "run_id",
                      "dimension",
                      "non_zero_count",
                      "speedup",
                      "max_absolute_error",
                  }

                  missing = required_columns - set(reader.fieldnames)
                  if missing:
                      raise SystemExit(
                          "CSV missing columns: " + ", ".join(sorted(missing))
                      )

                  matching = [
                      row for row in reader
                      if row.get("run_id") == expected_run_id
                  ]

          except (OSError, UnicodeError, csv.Error) as exc:
              raise SystemExit(f"Cannot read CSV: {exc}")

          if len(matching) != 1:
              raise SystemExit(
                  "Expected exactly one CSV record for RUN_ID; "
                  f"found {len(matching)}"
              )

          row = matching[0]

          try:
              dimension = int(row["dimension"])
              nnz = int(row["non_zero_count"])
              speedup = float(row["speedup"])
              max_error = float(row["max_absolute_error"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"Invalid CSV benchmark values: {exc}")

          if dimension != latest.get("dimension"):
              raise SystemExit("CSV/JSON dimension mismatch")

          if nnz != latest.get("nnz"):
              raise SystemExit("CSV/JSON NNZ mismatch")

          if not math.isfinite(speedup) or speedup <= 0:
              raise SystemExit("Invalid or non-finite speedup")

          if not math.isfinite(max_error) or max_error < 0:
              raise SystemExit("Invalid or non-finite maximum error")

          if max_error > 1e-12:
              raise SystemExit("Maximum numerical error exceeds 1e-12")

          if not math.isclose(
              speedup,
              float(latest["speedup"]),
              rel_tol=1e-8,
              abs_tol=1e-12,
          ):
              raise SystemExit("CSV/JSON speedup mismatch")

          if not math.isclose(
              max_error,
              float(latest["max_error"]),
              rel_tol=1e-8,
              abs_tol=1e-12,
          ):
              raise SystemExit("CSV/JSON maximum error mismatch")

          print("[PASS] Benchmark V2 schema.")
          print("[PASS] Benchmark validation status.")
          print("[PASS] JSON RUN_ID.")
          print("[PASS] Exactly one matching CSV record.")
          print("[PASS] CSV/JSON dimension and NNZ agreement.")
          print("[PASS] CSV/JSON speedup agreement.")
          print("[PASS] Numerical error <= 1e-12.")
          PY

          (
            cd P3
            sha256sum --check \
              "results/raw/${P3_RUN_ID}/SHA256SUMS.txt"
          )

          echo "[PASS] Run-scoped SHA256SUMS.txt verified."

      # ==========================================================
      # 11. BENCHMARK SUMMARY
      # ==========================================================

      - name: Generate benchmark summary
        id: benchmark_summary
        if: always() && steps.benchmark_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f P3/reports/benchmark-summary.md

          python3 P3/results/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${P3_RUN_ID}/validation-report.json" \
            --run-id "${P3_RUN_ID}" \
            --output P3/reports/benchmark-summary.md

          test -s P3/reports/benchmark-summary.md

          echo "[PASS] Benchmark summary generated."

      # ==========================================================
      # 12. PRELIMINARY REPORTS
      #
      # These reports are created before the first integrity pass.
      # ==========================================================

      - name: Generate preliminary P3 validation reports
        id: aggregate_reports
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("P3/reports")
          reports.mkdir(parents=True, exist_ok=True)

          gates = {
              "cleanup": os.environ["CLEANUP_OUTCOME"],
              "environment": os.environ["ENVIRONMENT_OUTCOME"],
              "preflight": os.environ["PREFLIGHT_OUTCOME"],
              "python_compile": os.environ["PY_COMPILE_OUTCOME"],
              "root_maven": os.environ["ROOT_MAVEN_OUTCOME"],
              "p3_maven": os.environ["P3_MAVEN_OUTCOME"],
              "pytest_all_suites": os.environ["PYTEST_OUTCOME"],
              "benchmark_execution": os.environ["BENCHMARK_OUTCOME"],
              "exact_run_evidence": os.environ["EVIDENCE_OUTCOME"],
              "benchmark_summary": os.environ["SUMMARY_OUTCOME"],
          }

          passed = all(value == "success" for value in gates.values())

          summary = {
              "schema": "qflpn-p3-validation-summary-v3",
              "workflow": "p3_validation",
              "run_id": os.environ["P3_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "gates": gates,
              "pre_integrity_status": "PASS" if passed else "FAIL",
              "manifest": "P3/MANIFEST.txt",
              "checksums": "P3/SHA256SUMS.txt",
              "integrity_generation_required": True,
              "integrity_verification_required": True,
          }

          acceptance = {
              "schema": "qflpn-p3-acceptance-v3",
              "workflow": "p3_validation",
              "run_id": summary["run_id"],
              "commit": summary["commit"],
              "status": "PRELIMINARY",
              "pre_integrity_gates": gates,
              "manifest": "P3/MANIFEST.txt",
              "checksums": "P3/SHA256SUMS.txt",
              "final_integrity_verification": "NOT_YET_EXECUTED",
              "final_verdict": "NOT_YET_DETERMINED",
          }

          (reports / "validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          (reports / "acceptance-report.json").write_text(
              json.dumps(acceptance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# QFLPN P3 — p3_validation",
              "",
              f"- RUN_ID: `{summary['run_id']}`",
              f"- Commit: `{summary['commit']}`",
              f"- Pre-integrity status: **{summary['pre_integrity_status']}**",
              "- Manifest: `P3/MANIFEST.txt`",
              "- Checksums: `P3/SHA256SUMS.txt`",
              "- Final verdict: pending integrity verification",
              "",
              "| Gate | Outcome |",
              "|---|---|",
          ]

          lines.extend(
              f"| {name} | {value.upper()} |"
              for name, value in gates.items()
          )

          lines.extend([
              "",
              "The final acceptance decision is enforced by the "
              "p3_validation job after final integrity verification.",
              "",
          ])

          (reports / "validation-summary.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          if not (reports / "benchmark-summary.md").is_file():
              (reports / "benchmark-summary.md").write_text(
                  "# QFLPN P3 benchmark summary\n\n"
                  "- Validation: **NOT EXECUTED OR FAILED**\n",
                  encoding="utf-8",
              )

          print("[PASS] Preliminary P3 reports generated.")
          PY

          test -s P3/reports/validation-summary.json
          test -s P3/reports/validation-summary.md
          test -s P3/reports/acceptance-report.json
          test -s P3/reports/benchmark-summary.md

      # ==========================================================
      # 13. FIRST MANIFEST AND SHA256 GENERATION
      #
      # The first integrity snapshot covers preliminary reports.
      # ==========================================================

      - name: Generate first P3 MANIFEST.txt and SHA256SUMS.txt
        id: integrity_generate_first
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "[PASS] First P3/MANIFEST.txt generated."
          echo "[PASS] First P3/SHA256SUMS.txt generated."

      # ==========================================================
      # 14. FIRST INDEPENDENT INTEGRITY VERIFICATION
      # ==========================================================

      - name: Verify first P3 integrity snapshot
        id: integrity_verify_first
        if: always() && steps.integrity_generate_first.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/verify_integrity.py
          python3 P3/tools/generate_integrity.py --check

          echo "[PASS] First independent integrity verification."
          echo "[PASS] First deterministic integrity check."

      # ==========================================================
      # 15. FINALIZE ACCEPTANCE REPORT
      #
      # This report records all gates up to the first integrity pass.
      # It is then included in the final manifest and SHA256 inventory.
      # ==========================================================

      - name: Finalize P3 acceptance report before final integrity
        id: acceptance_finalize
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
          REPORTS_OUTCOME: ${{ steps.aggregate_reports.outcome }}
          FIRST_GENERATE_OUTCOME: ${{ steps.integrity_generate_first.outcome }}
          FIRST_VERIFY_OUTCOME: ${{ steps.integrity_verify_first.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          reports = Path("P3/reports")
          run_id = os.environ["P3_RUN_ID"]

          gates = {
              "cleanup": os.environ["CLEANUP_OUTCOME"],
              "environment": os.environ["ENVIRONMENT_OUTCOME"],
              "preflight": os.environ["PREFLIGHT_OUTCOME"],
              "python_compile": os.environ["PY_COMPILE_OUTCOME"],
              "root_maven": os.environ["ROOT_MAVEN_OUTCOME"],
              "p3_maven": os.environ["P3_MAVEN_OUTCOME"],
              "pytest_all_suites": os.environ["PYTEST_OUTCOME"],
              "benchmark_execution": os.environ["BENCHMARK_OUTCOME"],
              "exact_run_evidence": os.environ["EVIDENCE_OUTCOME"],
              "benchmark_summary": os.environ["SUMMARY_OUTCOME"],
              "preliminary_reports": os.environ["REPORTS_OUTCOME"],
              "first_integrity_generation": os.environ["FIRST_GENERATE_OUTCOME"],
              "first_integrity_verification": os.environ["FIRST_VERIFY_OUTCOME"],
          }

          pre_final_pass = all(
              value == "success" for value in gates.values()
          )

          benchmark = {
              "run_id": run_id,
              "status": "NOT_VALIDATED",
              "speedup": None,
              "performance_classification": "NOT_CLASSIFIED",
              "maximum_absolute_error": None,
              "numerical_correctness": "NOT_VALIDATED",
              "numerical_tolerance": 1e-12,
          }

          if os.environ["EVIDENCE_OUTCOME"] == "success":
              csv_path = Path("P3/benchmarks/benchmark_results_v2.csv")

              with csv_path.open(
                  "r", encoding="utf-8-sig", newline=""
              ) as stream:
                  reader = csv.DictReader(stream, strict=True)
                  rows = [
                      row for row in reader
                      if row.get("run_id") == run_id
                  ]

              if len(rows) != 1:
                  raise SystemExit(
                      "Cannot finalize acceptance: expected exactly "
                      "one CSV row for RUN_ID"
                  )

              speedup = float(rows[0]["speedup"])
              max_error = float(rows[0]["max_absolute_error"])

              if not math.isfinite(speedup) or speedup <= 0:
                  raise SystemExit("Invalid benchmark speedup")

              if not math.isfinite(max_error) or max_error < 0:
                  raise SystemExit("Invalid benchmark maximum error")

              if max_error > 1e-12:
                  raise SystemExit(
                      "Numerical error exceeds benchmark tolerance 1e-12"
                  )

              benchmark = {
                  "run_id": run_id,
                  "status": "VALIDATED",
                  "speedup": speedup,
                  "performance_classification": (
                      "REGRESSION" if speedup < 1.0 else "NO_REGRESSION"
                  ),
                  "maximum_absolute_error": max_error,
                  "numerical_correctness": "PASS",
                  "numerical_tolerance": 1e-12,
              }

          acceptance = {
              "schema": "qflpn-p3-acceptance-v3",
              "workflow": "p3_validation",
              "run_id": run_id,
              "commit": os.environ["GITHUB_SHA"],
              "pre_final_integrity_status": (
                  "PASS" if pre_final_pass else "FAIL"
              ),
              "gates": gates,
              "benchmark": benchmark,
              "integrity": {
                  "manifest": "P3/MANIFEST.txt",
                  "checksums": "P3/SHA256SUMS.txt",
                  "first_generation": gates["first_integrity_generation"],
                  "first_independent_verification": (
                      gates["first_integrity_verification"]
                  ),
                  "final_generation": "REQUIRED_AFTER_THIS_REPORT",
                  "final_independent_verification": (
                      "REQUIRED_AFTER_FINAL_MANIFEST_GENERATION"
                  ),
              },
              "final_acceptance_verdict": (
                  "DETERMINED_BY_p3_validation_FINAL_GATE"
              ),
          }

          (reports / "acceptance-report.json").write_text(
              json.dumps(acceptance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = {
              "schema": "qflpn-p3-validation-summary-v3",
              "workflow": "p3_validation",
              "run_id": run_id,
              "commit": os.environ["GITHUB_SHA"],
              "gates": gates,
              "pre_final_integrity_status": (
                  "PASS" if pre_final_pass else "FAIL"
              ),
              "benchmark": benchmark,
              "manifest": "P3/MANIFEST.txt",
              "checksums": "P3/SHA256SUMS.txt",
              "final_verdict": (
                  "DETERMINED_BY_p3_validation_FINAL_GATE"
              ),
          }

          (reports / "validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# QFLPN P3 — p3_validation",
              "",
              f"- RUN_ID: `{run_id}`",
              f"- Commit: `{os.environ['GITHUB_SHA']}`",
              f"- Pre-final-integrity status: "
              f"**{summary['pre_final_integrity_status']}**",
              f"- First integrity generation: "
              f"**{gates['first_integrity_generation']}**",
              f"- First integrity verification: "
              f"**{gates['first_integrity_verification']}**",
              "",
              "## Benchmark",
              "",
              f"- Validation: **{benchmark['status']}**",
              f"- Speedup: `{benchmark['speedup']}`",
              f"- Performance classification: "
              f"**{benchmark['performance_classification']}**",
              f"- Maximum absolute error: "
              f"`{benchmark['maximum_absolute_error']}`",
              f"- Numerical correctness: "
              f"**{benchmark['numerical_correctness']}**",
              "",
              "## Integrity",
              "",
              "- `P3/MANIFEST.txt`",
              "- `P3/SHA256SUMS.txt`",
              "- Final manifest generation and independent verification "
              "are mandatory subsequent gates.",
              "",
              "## Gate results",
              "",
              "| Gate | Outcome |",
              "|---|---|",
          ]

          lines.extend(
              f"| {name} | {value.upper()} |"
              for name, value in gates.items()
          )

          lines.extend([
              "",
              "The authoritative final verdict is produced by "
              "the p3_validation final gate.",
              "",
          ])

          (reports / "validation-summary.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print("[PASS] Final acceptance report content generated.")
          print("[PASS] Benchmark performance classification recorded.")
          print("[INFO] Final integrity verification remains mandatory.")
          PY

          test -s P3/reports/acceptance-report.json
          test -s P3/reports/validation-summary.json
          test -s P3/reports/validation-summary.md

      # ==========================================================
      # 16. COMPLETE REPORT INVENTORY
      #
      # All reports must exist before final manifest generation.
      # ==========================================================

      - name: Verify complete P3 report and evidence inventory
        id: report_inventory
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"

          required_files=(
            "P3/reports/environment.txt"
            "P3/reports/pytest-report.txt"
            "P3/reports/benchmark-execution.log"
            "P3/reports/benchmark-summary.md"
            "P3/reports/validation-summary.json"
            "P3/reports/validation-summary.md"
            "P3/reports/acceptance-report.json"
            "P3/MANIFEST.txt"
            "P3/SHA256SUMS.txt"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing required report: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          test -d "$RUN_DIR"

          if [[ "${{ steps.benchmark.outcome }}" == "success" ]]; then
            benchmark_files=(
              "P3/benchmarks/benchmark_results_v2.csv"
              "${RUN_DIR}/benchmark-report.json"
              "${RUN_DIR}/benchmark-report.md"
              "${RUN_DIR}/benchmark-report.txt"
              "${RUN_DIR}/validation-report.json"
              "${RUN_DIR}/SHA256SUMS.txt"
            )

            for file in "${benchmark_files[@]}"; do
              if [[ ! -s "$file" ]]; then
                echo "::error::Missing benchmark evidence: $file"
                exit 1
              fi
              echo "[PASS] $file"
            done
          fi

          echo "[PASS] Complete P3 report inventory."

      # ==========================================================
      # 17. FINAL MANIFEST AND SHA256 GENERATION
      #
      # This second generation includes the finalized
      # acceptance-report.json and validation-summary files.
      # ==========================================================

      - name: Generate final P3 MANIFEST.txt and SHA256SUMS.txt
        id: integrity_generate_final
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          # The final acceptance report must be part of the manifest.
          grep -Fx "reports/acceptance-report.json" \
            P3/MANIFEST.txt

          # SHA256SUMS must contain the hash of MANIFEST.txt.
          grep -E '^[0-9a-f]{64}  MANIFEST\.txt$' \
            P3/SHA256SUMS.txt

          echo "[PASS] Final P3/MANIFEST.txt generated."
          echo "[PASS] Final P3/SHA256SUMS.txt generated."
          echo "[PASS] acceptance-report.json included in MANIFEST."
          echo "[PASS] MANIFEST.txt hash included in SHA256SUMS."

      # ==========================================================
      # 18. FINAL INDEPENDENT INTEGRITY VERIFICATION
      #
      # No file inside P3 may be modified after this step.
      # ==========================================================

      - name: Final independent P3 integrity verification
        id: integrity_verify_final
        if: always() && steps.integrity_generate_final.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          python3 P3/tools/verify_integrity.py

          python3 P3/tools/generate_integrity.py --check

          echo "[PASS] Final independent manifest verification."
          echo "[PASS] Final independent SHA-256 verification."
          echo "[PASS] Final deterministic integrity check."

      # ==========================================================
      # 19. STAGE EVIDENCE OUTSIDE P3
      #
      # This does not modify the P3 integrity inventory.
      # ==========================================================

      - name: Stage complete P3 evidence for publication
        id: stage_evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          DEST="${RUNNER_TEMP}/p3-validation-evidence"
          RUN_DIR="P3/results/raw/${P3_RUN_ID}"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [[ -d P3/reports ]]; then
            cp -a P3/reports "$DEST/reports"
          fi

          if [[ -d "$RUN_DIR" ]]; then
            mkdir -p "$DEST/results/raw"
            cp -a "$RUN_DIR" "$DEST/results/raw/"
          fi

          if [[ -s P3/benchmarks/benchmark_results_v2.csv ]]; then
            mkdir -p "$DEST/benchmarks"
            cp -a P3/benchmarks/benchmark_results_v2.csv \
              "$DEST/benchmarks/"
          fi

          if [[ -s P3/MANIFEST.txt ]]; then
            cp -a P3/MANIFEST.txt "$DEST/"
          fi

          if [[ -s P3/SHA256SUMS.txt ]]; then
            cp -a P3/SHA256SUMS.txt "$DEST/"
          fi

          test -d "$DEST"
          test -s "$DEST/MANIFEST.txt"
          test -s "$DEST/SHA256SUMS.txt"

          echo "[PASS] P3 evidence staged outside P3."

      # ==========================================================
      # 20. UPLOAD COMPLETE P3 EVIDENCE
      # ==========================================================

      - name: Upload complete P3 validation evidence
        id: upload_p3_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: P3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/p3-validation-evidence/

      # ==========================================================
      # 21. FINAL p3_validation ACCEPTANCE GATE
      #
      # Every required stage must succeed.
      # ==========================================================

      - name: Enforce final p3_validation acceptance
        id: final_gate
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PYTHON_DEPENDENCIES_OUTCOME: ${{ steps.python_dependencies.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
          REPORTS_OUTCOME: ${{ steps.aggregate_reports.outcome }}
          FIRST_GENERATE_OUTCOME: ${{ steps.integrity_generate_first.outcome }}
          FIRST_VERIFY_OUTCOME: ${{ steps.integrity_verify_first.outcome }}
          ACCEPTANCE_FINALIZE_OUTCOME: ${{ steps.acceptance_finalize.outcome }}
          REPORT_INVENTORY_OUTCOME: ${{ steps.report_inventory.outcome }}
          FINAL_GENERATE_OUTCOME: ${{ steps.integrity_generate_final.outcome }}
          FINAL_VERIFY_OUTCOME: ${{ steps.integrity_verify_final.outcome }}
          STAGE_EVIDENCE_OUTCOME: ${{ steps.stage_evidence.outcome }}
          UPLOAD_EVIDENCE_OUTCOME: ${{ steps.upload_p3_evidence.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          names = [
              "CHECKOUT_OUTCOME",
              "JAVA_OUTCOME",
              "PYTHON_OUTCOME",
              "PYTHON_DEPENDENCIES_OUTCOME",
              "CLEANUP_OUTCOME",
              "ENVIRONMENT_OUTCOME",
              "PREFLIGHT_OUTCOME",
              "PY_COMPILE_OUTCOME",
              "ROOT_MAVEN_OUTCOME",
              "P3_MAVEN_OUTCOME",
              "PYTEST_OUTCOME",
              "BENCHMARK_OUTCOME",
              "EVIDENCE_OUTCOME",
              "SUMMARY_OUTCOME",
              "REPORTS_OUTCOME",
              "FIRST_GENERATE_OUTCOME",
              "FIRST_VERIFY_OUTCOME",
              "ACCEPTANCE_FINALIZE_OUTCOME",
              "REPORT_INVENTORY_OUTCOME",
              "FINAL_GENERATE_OUTCOME",
              "FINAL_VERIFY_OUTCOME",
              "STAGE_EVIDENCE_OUTCOME",
              "UPLOAD_EVIDENCE_OUTCOME",
          ]

          gates = {
              name: os.environ.get(name, "missing")
              for name in names
          }

          passed = all(value == "success" for value in gates.values())

          verdict = {
              "schema": "qflpn-p3-final-verdict-v2",
              "workflow": "p3_validation",
              "run_id": os.environ["P3_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "status": "PASS" if passed else "FAIL",
              "gates": gates,
              "integrity": {
                  "manifest": "P3/MANIFEST.txt",
                  "checksums": "P3/SHA256SUMS.txt",
                  "first_generation": gates["FIRST_GENERATE_OUTCOME"],
                  "first_verification": gates["FIRST_VERIFY_OUTCOME"],
                  "final_generation": gates["FINAL_GENERATE_OUTCOME"],
                  "final_independent_verification": (
                      gates["FINAL_VERIFY_OUTCOME"]
                  ),
              },
              "acceptance_report": "P3/reports/acceptance-report.json",
              "evidence_artifact": (
                  "P3-validation-"
                  + os.environ["GITHUB_RUN_ID"]
                  + "-"
                  + os.environ["GITHUB_RUN_ATTEMPT"]
              ),
          }

          verdict_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "p3-validation-final-verdict.json"
          )

          verdict_path.write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("========================================")
          print("QFLPN P3 FINAL VALIDATION")
          print("========================================")
          print("JOB: p3_validation")
          print("RUN_ID:", verdict["run_id"])
          print("COMMIT:", verdict["commit"])

          for name, outcome in gates.items():
              print(f"{name}: {outcome}")

          print("FINAL STATUS:", verdict["status"])
          print("FINAL VERDICT:", verdict_path)

          if not passed:
              print("[FAIL] p3_validation")
              print(json.dumps(gates, indent=2))
              sys.exit(1)

          print("[PASS] p3_validation")
          print("[PASS] All mandatory gates succeeded.")
          print("[PASS] Final MANIFEST.txt generated.")
          print("[PASS] Final SHA256SUMS.txt generated.")
          print("[PASS] Final independent integrity verification passed.")
          print("[PASS] P3 evidence artifact uploaded.")
          PY

      # ==========================================================
      # 22. PUBLISH AUTHORITATIVE FINAL VERDICT
      # ==========================================================

      - name: Upload authoritative p3_validation final verdict
        id: upload_final_verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3_validation-final-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/p3-validation-final-verdict.json

      # ==========================================================
      # 23. COMPLETE GITHUB ACTIONS SUMMARY
      # ==========================================================

      - name: Publish complete p3_validation result
        if: always()
        shell: bash
        run: |
          {
            echo "# QFLPN P3 — p3_validation"
            echo
            echo "- RUN_ID: \`${P3_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch/ref: \`${GITHUB_REF}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo "## Integrity chain"
            echo "1. Preliminary P3 reports"
            echo "2. First MANIFEST.txt and SHA256SUMS.txt generation"
            echo "3. First independent integrity verification"
            echo "4. Final acceptance report generation"
            echo "5. Complete report inventory"
            echo "6. Final MANIFEST.txt and SHA256SUMS.txt generation"
            echo "7. Final independent integrity verification"
            echo
            echo "## Final P3 integrity files"
            echo "- \`P3/MANIFEST.txt\`"
            echo "- \`P3/SHA256SUMS.txt\`"
            echo
            echo "## P3 reports"
            echo "- \`P3/reports/environment.txt\`"
            echo "- \`P3/reports/pytest-report.txt\`"
            echo "- \`P3/reports/benchmark-execution.log\`"
            echo "- \`P3/reports/benchmark-summary.md\`"
            echo "- \`P3/reports/validation-summary.json\`"
            echo "- \`P3/reports/validation-summary.md\`"
            echo "- \`P3/reports/acceptance-report.json\`"
            echo
            echo "## Benchmark evidence"
            echo "- \`P3/benchmarks/benchmark_results_v2.csv\`"
            echo "- \`P3/results/raw/${P3_RUN_ID}/benchmark-report.json\`"
            echo "- \`P3/results/raw/${P3_RUN_ID}/benchmark-report.md\`"
            echo "- \`P3/results/raw/${P3_RUN_ID}/benchmark-report.txt\`"
            echo "- \`P3/results/raw/${P3_RUN_ID}/validation-report.json\`"
            echo "- \`P3/results/raw/${P3_RUN_ID}/SHA256SUMS.txt\`"
            echo
            echo "## Gate outcomes"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Cleanup | ${{ steps.cleanup.outcome }} |"
            echo "| Environment | ${{ steps.environment.outcome }} |"
            echo "| Preflight | ${{ steps.preflight.outcome }} |"
            echo "| Python compile | ${{ steps.py_compile.outcome }} |"
            echo "| Root Maven | ${{ steps.root_maven.outcome }} |"
            echo "| P3 Maven | ${{ steps.p3_maven.outcome }} |"
            echo "| Pytest | ${{ steps.pytest.outcome }} |"
            echo "| Benchmark | ${{ steps.benchmark.outcome }} |"
            echo "| Benchmark evidence | ${{ steps.benchmark_evidence.outcome }} |"
            echo "| Benchmark summary | ${{ steps.benchmark_summary.outcome }} |"
            echo "| Preliminary reports | ${{ steps.aggregate_reports.outcome }} |"
            echo "| First integrity generation | ${{ steps.integrity_generate_first.outcome }} |"
            echo "| First integrity verification | ${{ steps.integrity_verify_first.outcome }} |"
            echo "| Acceptance finalization | ${{ steps.acceptance_finalize.outcome }} |"
            echo "| Report inventory | ${{ steps.report_inventory.outcome }} |"
            echo "| Final integrity generation | ${{ steps.integrity_generate_final.outcome }} |"
            echo "| Final integrity verification | ${{ steps.integrity_verify_final.outcome }} |"
            echo "| Evidence staging | ${{ steps.stage_evidence.outcome }} |"
            echo "| Evidence upload | ${{ steps.upload_p3_evidence.outcome }} |"
            echo "| Final gate | ${{ steps.final_gate.outcome }} |"
            echo "| Final verdict upload | ${{ steps.upload_final_verdict.outcome }} |"
            echo
            echo "The authoritative acceptance status is determined by the "
            echo "p3_validation final gate and its final independent "
            echo "integrity verification."
          } >> "$GITHUB_STEP_SUMMARY"
