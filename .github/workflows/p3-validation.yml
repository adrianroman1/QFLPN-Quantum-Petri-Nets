name: P3 Validation — Complete Evidence and Integrity Chain

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
  P3_N: "1000000"
  P3_WARMUP: "5"
  P3_ITERATIONS: "10"
  P3_THRESHOLD: "4096"
  P3_PARALLELISM: "2"

jobs:
  p3_validation:
    name: p3_validation — complete P3 validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==================================================
      # 1. CHECKOUT AND ENVIRONMENT
      # ==================================================

      - name: Checkout exact commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        id: python_dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Create run directories and environment evidence
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports
          mkdir -p "P3/results/raw/${P3_RUN_ID}"

          {
            echo "QFLPN P3 VALIDATION ENVIRONMENT"
            echo "RUN_ID=${P3_RUN_ID}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "REF=${GITHUB_REF}"
            echo "EVENT=${GITHUB_EVENT_NAME}"
            echo "RUN=${GITHUB_RUN_ID}"
            echo "ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            java -version 2>&1
            echo
            mvn -version
            echo
            python --version
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
          } > P3/reports/environment.txt

          test -s P3/reports/environment.txt

      # ==================================================
      # 2. PREFLIGHT
      # CSV IS GENERATED BY THE BENCHMARK, NOT PREFLIGHT
      # ==================================================

      - name: Preflight — verify required project files
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "pom.xml"
            "P3/pom.xml"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/test_validate_benchmark.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/generate_integrity.py"
            "P3/tools/verify_integrity.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          test -d P3/benchmarks
          test -d P3/results

          echo "[PASS] P3 benchmark and results directories exist."

      # ==================================================
      # 3. PYTHON COMPILATION
      # ==================================================

      - name: Compile Python validation and integrity tools
        id: py_compile
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py

      # ==================================================
      # 4. MAVEN TESTS
      # ==================================================

      - name: Run root Maven tests
        id: root_maven
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mvn --batch-mode --no-transfer-progress test

      - name: Run P3 Maven tests
        id: p3_maven
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mvn --batch-mode --no-transfer-progress \
            -f P3/pom.xml test

      # ==================================================
      # 5. PYTHON TESTS
      # ==================================================

      - name: Run P3 Python validator tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest -q \
            P3/results/test_validate_benchmark.py \
            2>&1 | tee P3/reports/pytest-report.txt

      # ==================================================
      # 6. BENCHMARK EXECUTION
      # run_benchmark.sh generates the CSV and run evidence
      # ==================================================

      - name: Execute P3 benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ env.P3_RUN_ID }}
          N: ${{ env.P3_N }}
          WARMUP: ${{ env.P3_WARMUP }}
          ITERATIONS: ${{ env.P3_ITERATIONS }}
          THRESHOLD: ${{ env.P3_THRESHOLD }}
          PARALLELISM: ${{ env.P3_PARALLELISM }}
        run: |
          set -Eeuo pipefail

          chmod +x P3/results/run_benchmark.sh

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/benchmark-execution.log

      # ==================================================
      # 7. EXACT-RUN EVIDENCE VALIDATION
      # ==================================================

      - name: Validate exact benchmark RUN_ID evidence
        id: benchmark_evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          required_files=(
            "${CSV}"
            "${RUN_DIR}/benchmark-report.json"
            "${RUN_DIR}/benchmark-report.md"
            "${RUN_DIR}/benchmark-report.txt"
            "${RUN_DIR}/validation-report.json"
            "${RUN_DIR}/SHA256SUMS.txt"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty benchmark evidence: $file"
              exit 1
            fi
            echo "[PASS] $file"
          done

          python - "${CSV}" "${RUN_DIR}" "${P3_RUN_ID}" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          csv_path = Path(sys.argv[1])
          run_dir = Path(sys.argv[2])
          expected_run_id = sys.argv[3]

          validation_path = run_dir / "validation-report.json"

          try:
              report = json.loads(
                  validation_path.read_text(encoding="utf-8")
              )
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  f"Cannot read validation report: {exc}"
              )

          if not isinstance(report, dict):
              raise SystemExit("Validation report must be a JSON object")

          if report.get("schema") != "qflpn-benchmark-v2":
              raise SystemExit("Invalid benchmark validation schema")

          if report.get("validation") != "PASS":
              raise SystemExit("Benchmark validation is not PASS")

          if report.get("all_records_valid") is not True:
              raise SystemExit("Report does not confirm all records valid")

          records = report.get("records")
          if not isinstance(records, int) or records < 1:
              raise SystemExit("Invalid validation record count")

          latest = report.get("latest_record")
          if not isinstance(latest, dict):
              raise SystemExit("Missing latest_record object")

          if latest.get("run_id") != expected_run_id:
              raise SystemExit(
                  "Validation report RUN_ID does not match workflow RUN_ID"
              )

          try:
              with csv_path.open(
                  "r", encoding="utf-8-sig", newline=""
              ) as stream:
                  reader = csv.DictReader(stream, strict=True)

                  if not reader.fieldnames:
                      raise SystemExit("CSV header is missing")

                  if "run_id" not in reader.fieldnames:
                      raise SystemExit("CSV has no run_id column")

                  matching_rows = [
                      row for row in reader
                      if row.get("run_id") == expected_run_id
                  ]
          except (OSError, UnicodeError, csv.Error) as exc:
              raise SystemExit(f"Cannot read benchmark CSV: {exc}")

          if len(matching_rows) != 1:
              raise SystemExit(
                  "Expected exactly one CSV row for current RUN_ID; "
                  f"found {len(matching_rows)}"
              )

          row = matching_rows[0]

          if int(row["dimension"]) != latest.get("dimension"):
              raise SystemExit("CSV/JSON dimension mismatch")

          if int(row["non_zero_count"]) != latest.get("nnz"):
              raise SystemExit("CSV/JSON NNZ mismatch")

          print("[PASS] Validation JSON schema and status.")
          print("[PASS] Validation report RUN_ID.")
          print("[PASS] Exactly one CSV row for current RUN_ID.")
          print("[PASS] CSV and JSON workload dimensions agree.")
          PY

          (
            cd P3
            sha256sum --check \
              "results/raw/${P3_RUN_ID}/SHA256SUMS.txt"
          )

          echo "[PASS] Run-scoped SHA256SUMS.txt verified."

      # ==================================================
      # 8. BENCHMARK SUMMARY
      # ==================================================

      - name: Generate benchmark summary
        id: benchmark_summary
        if: always() && steps.benchmark_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/results/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${P3_RUN_ID}/validation-report.json" \
            --run-id "${P3_RUN_ID}" \
            --output P3/reports/benchmark-summary.md

          test -s P3/reports/benchmark-summary.md

      # ==================================================
      # 9. FINAL REPORTS
      # ALL P3 REPORT WRITES END HERE
      # ==================================================

      - name: Generate final validation and acceptance reports
        id: aggregate_reports
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("P3/reports")
          reports.mkdir(parents=True, exist_ok=True)

          gates = {
              "preflight": os.environ["PREFLIGHT_OUTCOME"],
              "python_compile": os.environ["PY_COMPILE_OUTCOME"],
              "root_maven": os.environ["ROOT_MAVEN_OUTCOME"],
              "p3_maven": os.environ["P3_MAVEN_OUTCOME"],
              "pytest": os.environ["PYTEST_OUTCOME"],
              "benchmark_execution": os.environ["BENCHMARK_OUTCOME"],
              "exact_run_evidence": os.environ["EVIDENCE_OUTCOME"],
              "benchmark_summary": os.environ["SUMMARY_OUTCOME"],
          }

          passed = all(value == "success" for value in gates.values())

          summary = {
              "schema": "qflpn-p3-validation-summary-v1",
              "run_id": os.environ["P3_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "gates": gates,
              "pre_integrity_gates": "PASS" if passed else "FAIL",
              "integrity": "PENDING_FINAL_GENERATION_AND_VERIFICATION",
              "acceptance": "PENDING_FINAL_GATE",
          }

          acceptance = {
              "schema": "qflpn-p3-acceptance-v1",
              "run_id": summary["run_id"],
              "commit": summary["commit"],
              "status": "PENDING_FINAL_GATE",
              "mandatory_gates_passed": passed,
              "gates": gates,
              "integrity": "PENDING_FINAL_GENERATION_AND_VERIFICATION",
          }

          (reports / "validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          (reports / "acceptance-report.json").write_text(
              json.dumps(acceptance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# QFLPN P3 — p3_validation",
              "",
              f"- Run ID: `{summary['run_id']}`",
              f"- Commit: `{summary['commit']}`",
              f"- Pre-integrity gates: **{summary['pre_integrity_gates']}**",
              "- Final integrity: **PENDING FINAL VERIFICATION**",
              "- Final acceptance: **PENDING FINAL GATE**",
              "",
              "| Mandatory gate | Outcome |",
              "|---|---|",
          ]

          lines.extend(
              f"| {name} | {value.upper()} |"
              for name, value in gates.items()
          )

          lines.extend([
              "",
              "The global P3 manifest and SHA-256 inventory are generated "
              "after all P3 reports have been written.",
              "",
              "No P3 report is modified after final integrity generation.",
              "",
          ])

          (reports / "validation-summary.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print("[PASS] Final P3 validation reports generated.")
          print("[INFO] Integrity and acceptance verdict remain pending "
                "until the final workflow gate.")
          PY

          test -s P3/reports/validation-summary.json
          test -s P3/reports/validation-summary.md
          test -s P3/reports/acceptance-report.json

      # ==================================================
      # 10. SINGLE FINAL INTEGRITY GENERATION
      # MANIFEST AND SHA256SUMS ARE CREATED ONCE
      # ==================================================

      - name: Generate final P3 MANIFEST.txt and SHA256SUMS.txt
        id: integrity_generate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "[PASS] P3/MANIFEST.txt generated."
          echo "[PASS] P3/SHA256SUMS.txt generated."

      # ==================================================
      # 11. INDEPENDENT INTEGRITY VERIFICATION
      # NO P3 FILE WRITES AFTER THIS POINT
      # ==================================================

      - name: Independently verify final P3 integrity
        id: integrity_verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          python3 P3/tools/verify_integrity.py

          python3 P3/tools/generate_integrity.py --check

          echo "[PASS] Independent P3 integrity verification."
          echo "[PASS] Deterministic integrity reproducibility check."

      # ==================================================
      # 12. FINAL p3_validation GATE
      # ==================================================

      - name: Enforce final p3_validation acceptance gate
        id: final_gate
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
          REPORTS_OUTCOME: ${{ steps.aggregate_reports.outcome }}
          INTEGRITY_GENERATE_OUTCOME: ${{ steps.integrity_generate.outcome }}
          INTEGRITY_VERIFY_OUTCOME: ${{ steps.integrity_verify.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          names = [
              "PREFLIGHT_OUTCOME",
              "PY_COMPILE_OUTCOME",
              "ROOT_MAVEN_OUTCOME",
              "P3_MAVEN_OUTCOME",
              "PYTEST_OUTCOME",
              "BENCHMARK_OUTCOME",
              "EVIDENCE_OUTCOME",
              "SUMMARY_OUTCOME",
              "REPORTS_OUTCOME",
              "INTEGRITY_GENERATE_OUTCOME",
              "INTEGRITY_VERIFY_OUTCOME",
          ]

          failures = {
              name: os.environ.get(name, "missing")
              for name in names
              if os.environ.get(name) != "success"
          }

          print("========================================")
          print("P3 FINAL VALIDATION")
          print("========================================")
          print("JOB: p3_validation")
          print("RUN_ID:", os.environ["P3_RUN_ID"])
          print("COMMIT:", os.environ["GITHUB_SHA"])
          print()

          for name in names:
              print(f"{name}: {os.environ.get(name, 'missing')}")

          print()

          if failures:
              print("[FAIL] p3_validation")
              print(json.dumps(failures, indent=2))
              sys.exit(1)

          print("[PASS] p3_validation")
          print("[PASS] All mandatory validation gates succeeded.")
          print("[PASS] Final reports were generated before integrity files.")
          print("[PASS] MANIFEST.txt and SHA256SUMS.txt were generated once.")
          print("[PASS] Independent integrity verification succeeded.")
          print("[PASS] Deterministic integrity check succeeded.")
          PY

      # ==================================================
      # 13. GITHUB STEP SUMMARY
      # Written outside P3; does not alter its integrity
      # ==================================================

      - name: Publish p3_validation result
        if: always()
        shell: bash
        run: |
          {
            echo "## P3 — p3_validation"
            echo
            echo "- Run ID: \`${P3_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Final gate: \`${{ steps.final_gate.outcome }}\`"
            echo "- Report generation: \`${{ steps.aggregate_reports.outcome }}\`"
            echo "- Integrity generation: \`${{ steps.integrity_generate.outcome }}\`"
            echo "- Integrity verification: \`${{ steps.integrity_verify.outcome }}\`"
            echo
            echo "### Global integrity"
            echo "- \`P3/MANIFEST.txt\`"
            echo "- \`P3/SHA256SUMS.txt\`"
            echo
            echo "### Run evidence"
            echo "- \`P3/results/raw/${P3_RUN_ID}/\`"
            echo
            echo "### Reports"
            echo "- \`P3/reports/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # 14. UPLOAD COMPLETE EVIDENCE
      # ==================================================

      - name: Upload complete P3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            P3/reports/
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/benchmarks/benchmark_results_v2.csv
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
