name: P3 Validation — Full Evidence and Integrity Chain

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  P3_RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}
  P3_N: "1000000"
  P3_WARMUP: "5"
  P3_ITERATIONS: "10"
  P3_THRESHOLD: "4096"
  P3_PARALLELISM: "2"

jobs:
  p3_validation:
    name: p3_validation — complete P3 validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==================================================
      # 1. CHECKOUT AND ENVIRONMENT
      # ==================================================

      - name: Checkout exact commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        id: python_dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Create P3 run directories and environment report
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports
          mkdir -p "P3/results/raw/${P3_RUN_ID}"

          {
            echo "QFLPN P3 VALIDATION ENVIRONMENT"
            echo "RUN_ID=${P3_RUN_ID}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "REF=${GITHUB_REF}"
            echo "EVENT=${GITHUB_EVENT_NAME}"
            echo "RUN=${GITHUB_RUN_ID}"
            echo "ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            java -version 2>&1
            echo
            mvn -version
            echo
            python --version
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
          } > P3/reports/environment.txt

          test -s P3/reports/environment.txt

      # ==================================================
      # 2. PREFLIGHT
      # CSV IS NOT REQUIRED HERE.
      # THE BENCHMARK GENERATES IT.
      # ==================================================

      - name: Preflight — verify required source files
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "pom.xml"
            "P3/pom.xml"
            "P3/results/run_benchmark.sh"
            "P3/results/validate_benchmark.py"
            "P3/results/test_validate_benchmark.py"
            "P3/results/generate_benchmark_summary.py"
            "P3/tools/generate_integrity.py"
            "P3/tools/verify_integrity.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi

            echo "[PASS] $file"
          done

          echo "[PASS] Static preflight completed."

      # ==================================================
      # 3. PYTHON COMPILATION
      # ==================================================

      - name: Compile P3 Python validation tools
        id: py_compile
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py

          echo "[PASS] Python compilation."

      # ==================================================
      # 4. ROOT MAVEN TESTS
      # ==================================================

      - name: Run root Maven tests
        id: root_maven
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mvn --batch-mode --no-transfer-progress test

      # ==================================================
      # 5. P3 MAVEN TESTS
      # ==================================================

      - name: Run P3 Maven tests
        id: p3_maven
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn --batch-mode --no-transfer-progress \
            -f P3/pom.xml test

      # ==================================================
      # 6. PYTHON TESTS
      # ==================================================

      - name: Run P3 Python validator tests
        id: pytest
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest -q \
            P3/results/test_validate_benchmark.py \
            2>&1 | tee P3/reports/pytest-report.txt

      # ==================================================
      # 7. BENCHMARK EXECUTION
      # ==================================================

      - name: Execute P3 benchmark
        id: benchmark
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ env.P3_RUN_ID }}
          N: ${{ env.P3_N }}
          WARMUP: ${{ env.P3_WARMUP }}
          ITERATIONS: ${{ env.P3_ITERATIONS }}
          THRESHOLD: ${{ env.P3_THRESHOLD }}
          PARALLELISM: ${{ env.P3_PARALLELISM }}
        run: |
          set -Eeuo pipefail

          chmod +x P3/results/run_benchmark.sh

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/benchmark-execution.log

          test -s P3/benchmarks/benchmark_results_v2.csv

          echo "[PASS] Benchmark CSV generated."

      # ==================================================
      # 8. EXACT RUN EVIDENCE VALIDATION
      # ==================================================

      - name: Verify exact benchmark RUN_ID evidence
        id: benchmark_evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="P3/results/raw/${P3_RUN_ID}"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          required_reports=(
            "benchmark-report.json"
            "benchmark-report.md"
            "benchmark-report.txt"
            "validation-report.json"
            "SHA256SUMS.txt"
          )

          for report in "${required_reports[@]}"; do
            if [[ ! -s "${RUN_DIR}/${report}" ]]; then
              echo "::error::Missing evidence: ${RUN_DIR}/${report}"
              exit 1
            fi

            echo "[PASS] ${RUN_DIR}/${report}"
          done

          test -s "$CSV"

          python - "$RUN_DIR" "$CSV" "$P3_RUN_ID" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])
          csv_path = Path(sys.argv[2])
          expected_run_id = sys.argv[3]

          def contains_run_id(value):
              if isinstance(value, dict):
                  return any(
                      contains_run_id(key) or contains_run_id(item)
                      for key, item in value.items()
                  )

              if isinstance(value, list):
                  return any(contains_run_id(item) for item in value)

              return (
                  isinstance(value, str)
                  and value == expected_run_id
              )

          for filename in (
              "benchmark-report.json",
              "validation-report.json",
          ):
              path = run_dir / filename
              data = json.loads(path.read_text(encoding="utf-8"))

              if not contains_run_id(data):
                  raise SystemExit(
                      f"RUN_ID mismatch in {filename}"
                  )

          with csv_path.open(
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as stream:
              reader = csv.DictReader(stream)

              if not reader.fieldnames or "run_id" not in reader.fieldnames:
                  raise SystemExit("CSV has no run_id column")

              matching_rows = [
                  row for row in reader
                  if row.get("run_id") == expected_run_id
              ]

          if len(matching_rows) != 1:
              raise SystemExit(
                  "Expected exactly one CSV record for "
                  f"{expected_run_id}; found {len(matching_rows)}"
              )

          report = json.loads(
              (run_dir / "validation-report.json").read_text(
                  encoding="utf-8"
              )
          )

          if report.get("schema") != "qflpn-benchmark-v2":
              raise SystemExit("Unexpected validation report schema")

          if report.get("validation") != "PASS":
              raise SystemExit("Benchmark validation is not PASS")

          latest = report.get("latest_record")

          if not isinstance(latest, dict):
              raise SystemExit("Missing latest_record")

          if latest.get("run_id") != expected_run_id:
              raise SystemExit("Validation report RUN_ID mismatch")

          print("[PASS] Exact RUN_ID in JSON reports.")
          print("[PASS] Exactly one matching CSV record.")
          print("[PASS] Benchmark validation report is PASS.")
          PY

          (
            cd P3
            sha256sum --check \
              "results/raw/${P3_RUN_ID}/SHA256SUMS.txt"
          )

          echo "[PASS] Run-scoped SHA256 verification."

      # ==================================================
      # 9. BENCHMARK SUMMARY
      # ==================================================

      - name: Generate benchmark summary
        id: benchmark_summary
        if: always() && steps.benchmark_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/results/generate_benchmark_summary.py \
            --csv P3/benchmarks/benchmark_results_v2.csv \
            --report "P3/results/raw/${P3_RUN_ID}/validation-report.json" \
            --run-id "${P3_RUN_ID}" \
            --output P3/reports/benchmark-summary.md

          test -s P3/reports/benchmark-summary.md

          echo "[PASS] Benchmark summary generated."

      # ==================================================
      # 10. FINAL REPORT GENERATION
      # NO REPORT IS MODIFIED AFTER THIS STEP.
      # ==================================================

      - name: Generate final validation and acceptance reports
        id: final_reports
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("P3/reports")
          reports.mkdir(parents=True, exist_ok=True)

          gates = {
              "preflight": os.environ["PREFLIGHT_OUTCOME"],
              "python_compile": os.environ["PY_COMPILE_OUTCOME"],
              "root_maven": os.environ["ROOT_MAVEN_OUTCOME"],
              "p3_maven": os.environ["P3_MAVEN_OUTCOME"],
              "pytest": os.environ["PYTEST_OUTCOME"],
              "benchmark_execution": os.environ["BENCHMARK_OUTCOME"],
              "exact_run_evidence": os.environ["EVIDENCE_OUTCOME"],
              "benchmark_summary": os.environ["SUMMARY_OUTCOME"],
          }

          passed = all(
              outcome == "success"
              for outcome in gates.values()
          )

          run_id = os.environ["P3_RUN_ID"]
          commit = os.environ["GITHUB_SHA"]

          summary = {
              "schema": "qflpn-p3-validation-summary-v2",
              "run_id": run_id,
              "commit": commit,
              "event": os.environ["GITHUB_EVENT_NAME"],
              "gates": gates,
              "pre_integrity_gates": (
                  "PASS" if passed else "FAIL"
              ),
              "integrity_status": "PENDING_FINAL_VERIFICATION",
              "overall_status": "PENDING_FINAL_INTEGRITY",
          }

          acceptance = {
              "schema": "qflpn-p3-acceptance-v2",
              "run_id": run_id,
              "commit": commit,
              "mandatory_gates_passed": passed,
              "gates": gates,
              "integrity_status": "PENDING_FINAL_VERIFICATION",
              "status": (
                  "PENDING_FINAL_INTEGRITY"
                  if passed else "FAIL"
              ),
          }

          (reports / "validation-summary.json").write_text(
              json.dumps(
                  summary,
                  indent=2,
                  sort_keys=True,
                  allow_nan=False
              ) + "\n",
              encoding="utf-8",
          )

          (reports / "acceptance-report.json").write_text(
              json.dumps(
                  acceptance,
                  indent=2,
                  sort_keys=True,
                  allow_nan=False
              ) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# QFLPN P3 — p3_validation",
              "",
              f"- Run ID: `{run_id}`",
              f"- Commit: `{commit}`",
              f"- Pre-integrity gates: **{summary['pre_integrity_gates']}**",
              "- Final integrity: **PENDING FINAL VERIFICATION**",
              "",
              "| Mandatory gate | Outcome |",
              "|---|---|",
          ]

          for name, outcome in gates.items():
              lines.append(
                  f"| {name} | {outcome.upper()} |"
              )

          lines.extend([
              "",
              "The final integrity files are generated only after "
              "all reports have been written.",
              "",
              "No P3 report is modified after final manifest generation.",
              "",
          ])

          (reports / "validation-summary.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print("[PASS] Final reports generated.")
          print("[INFO] Integrity verification is pending.")
          PY

      # ==================================================
      # 11. VERIFY REPORTS BEFORE MANIFEST GENERATION
      # ==================================================

      - name: Validate final reports and RUN_ID consistency
        id: report_validation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          from pathlib import Path
          import os

          root = Path("P3/reports")
          run_id = os.environ["P3_RUN_ID"]
          commit = os.environ["GITHUB_SHA"]

          summary_path = root / "validation-summary.json"
          acceptance_path = root / "acceptance-report.json"
          markdown_path = root / "validation-summary.md"

          for path in (
              summary_path,
              acceptance_path,
              markdown_path,
          ):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty report: {path}")

          summary = json.loads(
              summary_path.read_text(encoding="utf-8")
          )

          acceptance = json.loads(
              acceptance_path.read_text(encoding="utf-8")
          )

          if summary.get("schema") != "qflpn-p3-validation-summary-v2":
              raise SystemExit("Invalid validation summary schema")

          if acceptance.get("schema") != "qflpn-p3-acceptance-v2":
              raise SystemExit("Invalid acceptance report schema")

          for name, report in (
              ("validation summary", summary),
              ("acceptance report", acceptance),
          ):
              if report.get("run_id") != run_id:
                  raise SystemExit(f"{name}: RUN_ID mismatch")

              if report.get("commit") != commit:
                  raise SystemExit(f"{name}: commit mismatch")

          if summary.get("gates") != acceptance.get("gates"):
              raise SystemExit("Gate results differ between reports")

          if not isinstance(summary.get("gates"), dict):
              raise SystemExit("Missing gate results")

          markdown = markdown_path.read_text(encoding="utf-8")

          if run_id not in markdown:
              raise SystemExit("RUN_ID missing from Markdown report")

          if commit not in markdown:
              raise SystemExit("Commit missing from Markdown report")

          print("[PASS] Validation summary JSON.")
          print("[PASS] Acceptance report JSON.")
          print("[PASS] RUN_ID consistency.")
          print("[PASS] Commit consistency.")
          print("[PASS] Markdown report.")
          PY

      # ==================================================
      # 12. FINAL MANIFEST GENERATION
      # ALL P3 REPORTS ARE ALREADY FINAL.
      # ==================================================

      - name: Generate final P3 MANIFEST.txt and SHA256SUMS.txt
        id: final_integrity_generate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "[PASS] P3/MANIFEST.txt generated."
          echo "[PASS] P3/SHA256SUMS.txt generated."

      # ==================================================
      # 13. INDEPENDENT FINAL VERIFICATION
      # NO FILES INSIDE P3 ARE MODIFIED AFTER THIS POINT.
      # ==================================================

      - name: Independently verify final P3 integrity
        id: final_integrity_verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          python3 P3/tools/verify_integrity.py

          python3 P3/tools/generate_integrity.py --check

          echo "[PASS] Independent MANIFEST verification."
          echo "[PASS] Independent SHA256 verification."
          echo "[PASS] Deterministic integrity reproducibility."

      # ==================================================
      # 14. FINAL p3_validation GATE
      # THIS STEP DOES NOT MODIFY P3.
      # ==================================================

      - name: Enforce final p3_validation acceptance gate
        id: final_gate
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PY_COMPILE_OUTCOME: ${{ steps.py_compile.outcome }}
          ROOT_MAVEN_OUTCOME: ${{ steps.root_maven.outcome }}
          P3_MAVEN_OUTCOME: ${{ steps.p3_maven.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.benchmark_evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.benchmark_summary.outcome }}
          REPORT_VALIDATION_OUTCOME: ${{ steps.report_validation.outcome }}
          FINAL_GENERATE_OUTCOME: ${{ steps.final_integrity_generate.outcome }}
          FINAL_VERIFY_OUTCOME: ${{ steps.final_integrity_verify.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          names = [
              "PREFLIGHT_OUTCOME",
              "PY_COMPILE_OUTCOME",
              "ROOT_MAVEN_OUTCOME",
              "P3_MAVEN_OUTCOME",
              "PYTEST_OUTCOME",
              "BENCHMARK_OUTCOME",
              "EVIDENCE_OUTCOME",
              "SUMMARY_OUTCOME",
              "REPORT_VALIDATION_OUTCOME",
              "FINAL_GENERATE_OUTCOME",
              "FINAL_VERIFY_OUTCOME",
          ]

          outcomes = {
              name: os.environ.get(name, "missing")
              for name in names
          }

          failures = {
              name: outcome
              for name, outcome in outcomes.items()
              if outcome != "success"
          }

          print("========================================")
          print("P3 FINAL VALIDATION")
          print("========================================")
          print("RUN_ID:", os.environ["P3_RUN_ID"])
          print("COMMIT:", os.environ["GITHUB_SHA"])

          for name, outcome in outcomes.items():
              print(f"{name}: {outcome}")

          if failures:
              print("[FAIL] p3_validation")
              print(json.dumps(failures, indent=2))
              sys.exit(1)

          print("[PASS] p3_validation")
          print("[PASS] All mandatory validation gates.")
          print("[PASS] Final reports verified.")
          print("[PASS] MANIFEST.txt generated.")
          print("[PASS] SHA256SUMS.txt generated.")
          print("[PASS] Independent integrity verification.")
          print("[PASS] Integrity reproducibility check.")
          PY

      # ==================================================
      # 15. GITHUB STEP SUMMARY
      # OUTSIDE P3 — DOES NOT CHANGE THE MANIFEST.
      # ==================================================

      - name: Publish p3_validation result
        if: always()
        shell: bash
        run: |
          {
            echo "## P3 — p3_validation"
            echo
            echo "- Run ID: \`${P3_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Final gate: \`${{ steps.final_gate.outcome }}\`"
            echo "- Report validation: \`${{ steps.report_validation.outcome }}\`"
            echo "- Manifest generation: \`${{ steps.final_integrity_generate.outcome }}\`"
            echo "- Independent verification: \`${{ steps.final_integrity_verify.outcome }}\`"
            echo
            echo "### Integrity files"
            echo "- \`P3/MANIFEST.txt\`"
            echo "- \`P3/SHA256SUMS.txt\`"
            echo
            echo "### Evidence"
            echo "- \`P3/results/raw/${P3_RUN_ID}/\`"
            echo "- \`P3/reports/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # 16. COMPLETE ARTIFACT PUBLICATION
      # ==================================================

      - name: Upload complete P3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            P3/reports/
            P3/results/raw/${{ env.P3_RUN_ID }}/
            P3/benchmarks/benchmark_results_v2.csv
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
