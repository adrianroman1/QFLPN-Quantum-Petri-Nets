name: P3 Complete Validation and Reproducibility

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "P3/**"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/p3-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3_validation:
    name: P3 Complete Mathematical, Software and Integrity Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      P3_ROOT: P3
      N: "1000000"
      WARMUP: "5"
      ITERATIONS: "10"
      THRESHOLD: "4096"
      PARALLELISM: "2"
      RUN_ID: p3-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ========================================================
      # 1. CHECKOUT AND ENVIRONMENT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Record P3 execution environment
        id: p3_environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P3/reports

          {
            echo "QFLPN P3 EXECUTION ENVIRONMENT"
            echo
            echo "UTC:"
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo
            echo "Repository:"
            git remote get-url origin
            echo
            echo "Branch:"
            echo "${GITHUB_REF_NAME:-unknown}"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Workflow:"
            echo "${GITHUB_WORKFLOW:-unknown}"
            echo
            echo "Run ID:"
            echo "${GITHUB_RUN_ID:-unknown}"
            echo
            echo "Run attempt:"
            echo "${GITHUB_RUN_ATTEMPT:-unknown}"
            echo
            echo "P3 benchmark RUN_ID:"
            echo "$RUN_ID"
            echo
            echo "Java:"
            java -version
            echo
            echo "Maven:"
            mvn --version
            echo
            echo "Python:"
            python --version
            echo
            echo "Pytest:"
            python -m pytest --version
            echo
            echo "Operating system:"
            uname -a
            echo
            echo "CPU:"
            lscpu
            echo
            echo "Memory:"
            free -h
            echo
            echo "Benchmark configuration:"
            echo "N=$N"
            echo "WARMUP=$WARMUP"
            echo "ITERATIONS=$ITERATIONS"
            echo "THRESHOLD=$THRESHOLD"
            echo "PARALLELISM=$PARALLELISM"
            echo
            echo "Python packages:"
            python -m pip freeze
          } > P3/reports/environment.txt 2>&1

          test -s P3/reports/environment.txt

          echo "P3_ENVIRONMENT_CAPTURED"

      # ========================================================
      # 2. REQUIRED P3 FILES
      # ========================================================

      - name: Validate required P3 source and validation files
        id: p3_required_files
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "P3/pom.xml",
              "P3/ACCEPTANCE_CHECKLIST.md",
              "P3/ACCEPTANCE_REPORT.md",
              "P3/INTEGRITY.md",
              "P3/P3_AUDIT_REPORT.md",
              "P3/VALIDATION_ALIGNMENT.md",
              "P3/VALIDATION_PROTOCOL.md",
              "P3/results/run_benchmark.sh",
              "P3/results/validate_benchmark.py",
              "P3/results/test_validate_benchmark.py",
              "P3/results/generate_benchmark_summary.py",
              "P3/tools/generate_integrity.py",
              "P3/tools/verify_integrity.py",
              "P3/tests/test_generate_integrity.py",
              "P3/tests/test_verify_integrity.py",
              "P3/MANIFEST.txt",
              "P3/SHA256SUMS.txt",
          ]

          missing = [
              item for item in required
              if not Path(item).is_file()
          ]

          if missing:
              print("P3_REQUIRED_FILES_FAILED")
              for item in missing:
                  print("MISSING:", item)
              sys.exit(1)

          print("P3_REQUIRED_FILES_ACCEPTED")
          PY

      - name: Validate P3 benchmark runner permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f P3/results/run_benchmark.sh
          bash -n P3/results/run_benchmark.sh

          echo "P3_BENCHMARK_RUNNER_SYNTAX_ACCEPTED"

      # ========================================================
      # 3. PYTHON SYNTAX VALIDATION
      # ========================================================

      - name: Compile all P3 Python validation scripts
        id: p3_python_compile
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            P3/results/validate_benchmark.py \
            P3/results/test_validate_benchmark.py \
            P3/results/generate_benchmark_summary.py \
            P3/tools/generate_integrity.py \
            P3/tools/verify_integrity.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py

          python -m compileall -q \
            P3/results \
            P3/tools \
            P3/tests

          echo "P3_PYTHON_COMPILATION_ACCEPTED"

      # ========================================================
      # 4. PYTHON UNIT AND INTEGRITY TESTS
      # ========================================================

      - name: Run P3 benchmark validator tests
        id: p3_benchmark_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/results/test_validate_benchmark.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/benchmark-validator-tests.log

      - name: Run P3 manifest generator tests
        id: p3_manifest_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/tests/test_generate_integrity.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/manifest-generator-tests.log

      - name: Run P3 independent integrity verifier tests
        id: p3_integrity_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/tests/test_verify_integrity.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/integrity-verifier-tests.log

      - name: Run complete P3 Python validation test suite
        id: p3_python_tests
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pytest \
            P3/results/test_validate_benchmark.py \
            P3/tests/test_generate_integrity.py \
            P3/tests/test_verify_integrity.py \
            -v \
            --tb=short \
            2>&1 | tee P3/reports/python-validation-tests.log

      # ========================================================
      # 5. ROOT PROJECT MAVEN VALIDATION
      # ========================================================

      - name: Run root Maven clean test
        id: p3_root_maven
        shell: bash
        run: |
          set -Eeuo pipefail

          mvn -B clean test \
            2>&1 | tee P3/reports/root-maven-validation.log

      # ========================================================
      # 6. P3 JAVA TESTS AND BENCHMARK
      # ========================================================

      - name: Run complete P3 Maven, CSR benchmark and V2 validation
        id: p3_benchmark
        shell: bash
        run: |
          set -Eeuo pipefail

          export N
          export WARMUP
          export ITERATIONS
          export THRESHOLD
          export PARALLELISM
          export RUN_ID

          bash P3/results/run_benchmark.sh \
            2>&1 | tee P3/reports/p3-benchmark-execution.log

          test -s P3/benchmarks/benchmark_results_v2.csv

          test -s "P3/results/raw/$RUN_ID/validation-report.json"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.txt"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.md"
          test -s "P3/results/raw/$RUN_ID/benchmark-report.json"
          test -s "P3/results/raw/$RUN_ID/SHA256SUMS.txt"

          echo "P3_BENCHMARK_AND_V2_VALIDATION_ACCEPTED"

      # ========================================================
      # 7. CROSS-VALIDATE CSV AND JSON REPORT
      # ========================================================

      - name: Generate P3 benchmark evidence summary
        id: p3_benchmark_summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          REPORT="P3/results/raw/$RUN_ID/validation-report.json"
          CSV="P3/benchmarks/benchmark_results_v2.csv"

          if [ ! -s "$REPORT" ] || [ ! -s "$CSV" ]; then
            {
              echo "## P3 benchmark evidence"
              echo
              echo "**FAIL — benchmark CSV or validation report missing.**"
              echo
              echo "- CSV: $CSV"
              echo "- Report: $REPORT"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "P3_BENCHMARK_SUMMARY_UNAVAILABLE"
            exit 1
          fi

          python P3/results/generate_benchmark_summary.py \
            --csv "$CSV" \
            --report "$REPORT" \
            --output "$GITHUB_STEP_SUMMARY" \
            --run-id "$RUN_ID"

          echo "P3_BENCHMARK_SUMMARY_GENERATED"

      # ========================================================
      # 8. FINAL GLOBAL P3 INTEGRITY GENERATION
      # ========================================================

      - name: Generate final P3 MANIFEST and SHA256SUMS
        id: p3_integrity_generate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --write

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          echo "P3_MANIFEST_AND_SHA256SUMS_GENERATED"

      # ========================================================
      # 9. INDEPENDENT INTEGRITY VERIFICATION
      # ========================================================

      - name: Independently verify P3 MANIFEST and SHA256SUMS
        id: p3_integrity_verify
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s P3/MANIFEST.txt
          test -s P3/SHA256SUMS.txt

          python3 P3/tools/verify_integrity.py

          echo "P3_INDEPENDENT_INTEGRITY_VERIFICATION_ACCEPTED"

      - name: Verify P3 integrity reproducibility without modifying files
        id: p3_integrity_reproducibility
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 P3/tools/generate_integrity.py --check

          echo "P3_INTEGRITY_REPRODUCIBILITY_ACCEPTED"

      # ========================================================
      # 10.1. MANDATORY INDIVIDUAL MANIFEST PUBLICATION
      # ========================================================

      - name: Verify and publish complete P3 MANIFEST.txt
        id: p3_display_manifest
        if: always()
        shell: bash
        env:
          GENERATE_OUTCOME: ${{ steps.p3_integrity_generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.p3_integrity_verify.outcome }}
          CHECK_OUTCOME: ${{ steps.p3_integrity_reproducibility.outcome }}
        run: |
          set -Eeuo pipefail

          FILE="P3/MANIFEST.txt"

          test -f "$FILE"
          test ! -L "$FILE"
          test -s "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          content = raw.decode("utf-8")

          if not content.endswith("\n"):
              raise SystemExit("P3_MANIFEST_MISSING_FINAL_NEWLINE")

          lines = content.splitlines()

          if len(lines) < 3:
              raise SystemExit("P3_MANIFEST_TOO_SHORT")

          if lines[0] != "# QFLPN P3 generated manifest":
              raise SystemExit("P3_MANIFEST_INVALID_HEADER")

          if lines[1] != "# Format: one repository-relative POSIX path per line":
              raise SystemExit("P3_MANIFEST_INVALID_FORMAT_DECLARATION")

          match = re.fullmatch(
              r"# File count: (0|[1-9][0-9]*)",
              lines[2]
          )

          if not match:
              raise SystemExit("P3_MANIFEST_INVALID_FILE_COUNT")

          entries = lines[3:]

          if len(entries) != int(match.group(1)):
              raise SystemExit("P3_MANIFEST_FILE_COUNT_MISMATCH")

          if any(not item for item in entries):
              raise SystemExit("P3_MANIFEST_CONTAINS_BLANK_ENTRY")

          if entries != sorted(entries):
              raise SystemExit("P3_MANIFEST_ENTRIES_NOT_SORTED")

          if len(entries) != len(set(entries)):
              raise SystemExit("P3_MANIFEST_ENTRIES_NOT_UNIQUE")

          for item in entries:
              candidate = Path(item)

              if (
                  candidate.is_absolute()
                  or "\\" in item
                  or ".." in candidate.parts
                  or item.startswith("./")
                  or item.strip() != item
                  or item in {"MANIFEST.txt", "SHA256SUMS.txt"}
              ):
                  raise SystemExit(
                      f"P3_MANIFEST_UNSAFE_PATH: {item}"
                  )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as stream:
              stream.write(
                  "# P3 — MANIFEST.txt "
                  "(complete, individual evidence)\n\n"
              )
              stream.write(
                  f"- Generator outcome: "
                  f"{os.environ.get('GENERATE_OUTCOME')}\n"
              )
              stream.write(
                  f"- Independent verifier outcome: "
                  f"{os.environ.get('VERIFY_OUTCOME')}\n"
              )
              stream.write(
                  f"- Reproducibility outcome: "
                  f"{os.environ.get('CHECK_OUTCOME')}\n"
              )
              stream.write(f"- Bytes published: {len(raw)}\n\n")
              stream.write("```text\n")
              stream.write(content)
              stream.write("```\n")

          print("P3_MANIFEST_INDIVIDUAL_PUBLICATION_ACCEPTED")
          print(f"P3_MANIFEST_BYTES={len(raw)}")
          PY

      # ========================================================
      # 10.2. MANDATORY INDIVIDUAL SHA256 PUBLICATION
      # ========================================================

      - name: Verify MANIFEST SHA-256 and publish complete P3 SHA256SUMS.txt
        id: p3_display_sha256
        if: always()
        shell: bash
        env:
          GENERATE_OUTCOME: ${{ steps.p3_integrity_generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.p3_integrity_verify.outcome }}
          CHECK_OUTCOME: ${{ steps.p3_integrity_reproducibility.outcome }}
        run: |
          set -Eeuo pipefail

          FILE="P3/SHA256SUMS.txt"
          MANIFEST="P3/MANIFEST.txt"

          test -f "$FILE"
          test ! -L "$FILE"
          test -s "$FILE"

          test -f "$MANIFEST"
          test ! -L "$MANIFEST"
          test -s "$MANIFEST"

          python3 - "$FILE" "$MANIFEST" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          import sys

          checksum_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])

          raw = checksum_path.read_bytes()
          content = raw.decode("ascii")

          if not content.endswith("\n"):
              raise SystemExit(
                  "P3_SHA256SUMS_MISSING_FINAL_NEWLINE"
              )

          lines = content.splitlines()

          if not lines:
              raise SystemExit("P3_SHA256SUMS_EMPTY")

          entries = []
          names = set()

          for number, line in enumerate(lines, start=1):
              match = re.fullmatch(
                  r"([0-9a-f]{64})  ([^\r\n]+)",
                  line
              )

              if not match:
                  raise SystemExit(
                      f"P3_SHA256SUMS_INVALID_LINE_{number}"
                  )

              digest, name = match.groups()
              candidate = Path(name)

              if (
                  candidate.is_absolute()
                  or "\\" in name
                  or ".." in candidate.parts
                  or name.startswith("./")
                  or name.strip() != name
              ):
                  raise SystemExit(
                      f"P3_SHA256SUMS_UNSAFE_PATH_{number}"
                  )

              if name in names:
                  raise SystemExit(
                      f"P3_SHA256SUMS_DUPLICATE_PATH_{number}"
                  )

              names.add(name)
              entries.append((name, digest))

          ordered_names = [
              name for name, digest in entries
          ]

          if ordered_names != sorted(ordered_names):
              raise SystemExit(
                  "P3_SHA256SUMS_ENTRIES_NOT_SORTED"
              )

          manifest_entries = [
              digest
              for name, digest in entries
              if name == "MANIFEST.txt"
          ]

          if len(manifest_entries) != 1:
              raise SystemExit(
                  "P3_SHA256SUMS_MUST_CONTAIN_EXACTLY_ONE_MANIFEST_HASH"
              )

          actual_manifest_hash = hashlib.sha256(
              manifest_path.read_bytes()
          ).hexdigest()

          if manifest_entries[0] != actual_manifest_hash:
              raise SystemExit(
                  "P3_MANIFEST_SHA256_MISMATCH"
              )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary.open("a", encoding="utf-8") as stream:
              stream.write(
                  "# P3 — SHA256SUMS.txt "
                  "(complete, individual evidence)\n\n"
              )
              stream.write(
                  f"- Generator outcome: "
                  f"{os.environ.get('GENERATE_OUTCOME')}\n"
              )
              stream.write(
                  f"- Independent verifier outcome: "
                  f"{os.environ.get('VERIFY_OUTCOME')}\n"
              )
              stream.write(
                  f"- Reproducibility outcome: "
                  f"{os.environ.get('CHECK_OUTCOME')}\n"
              )
              stream.write(
                  f"- MANIFEST.txt SHA-256: "
                  f"`{actual_manifest_hash}` — MATCH\n"
              )
              stream.write(
                  f"- Checksum entries: {len(entries)}\n"
              )
              stream.write(
                  f"- Bytes published: {len(raw)}\n\n"
              )
              stream.write("```text\n")
              stream.write(content)
              stream.write("```\n")

          print(
              "P3_SHA256SUMS_FORMAT_AND_MANIFEST_HASH_ACCEPTED"
          )
          print(
              "P3_SHA256SUMS_INDIVIDUAL_PUBLICATION_ACCEPTED"
          )
          print(f"P3_SHA256SUMS_BYTES={len(raw)}")
          PY

      # ========================================================
      # 10. AUTOMATIC DISCOVERY AND FULL DISPLAY
      #     ALL P3 .MD, .CSX AND .TXT FILES
      # ========================================================

      - name: Discover and display ALL P3 MD CSX TXT files
        id: p3_display_all_text
        if: always()
        shell: bash
        env:
          GENERATE_OUTCOME: ${{ steps.p3_integrity_generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.p3_integrity_verify.outcome }}
          REPRODUCIBILITY_OUTCOME: ${{ steps.p3_integrity_reproducibility.outcome }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import os
          import sys

          root = Path("P3").resolve()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          extensions = {".md", ".csx", ".txt"}

          files = sorted(
              (
                  path for path in root.rglob("*")
                  if path.is_file()
                  and not path.is_symlink()
                  and path.suffix.lower() in extensions
              ),
              key=lambda path: path.relative_to(root).as_posix().lower()
          )

          relative_names = {
              path.relative_to(root).as_posix()
              for path in files
          }

          required = {
              "MANIFEST.txt",
              "SHA256SUMS.txt",
          }

          missing = sorted(required - relative_names)

          output = [
              "# QFLPN P3 — COMPLETE AUTOMATIC TEXT FILE PUBLICATION",
              "",
              f"Discovered files: **{len(files)}**",
              "",
              "Extensions: `.md`, `.csx`, `.txt`",
              "",
              "| Integrity operation | Outcome |",
              "|---|---|",
              f"| Generate MANIFEST and SHA256SUMS | {os.environ.get('GENERATE_OUTCOME')} |",
              f"| Independent integrity verification | {os.environ.get('VERIFY_OUTCOME')} |",
              f"| Reproducibility check | {os.environ.get('REPRODUCIBILITY_OUTCOME')} |",
              "",
          ]

          if missing:
              output.append(
                  "**ERROR: Missing required integrity files: "
                  + ", ".join(missing)
                  + "**"
              )
              output.append("")

          for path in files:
              relative = path.relative_to(root).as_posix()

              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError) as exc:
                  output.extend([
                      f"## FILE: `P3/{relative}`",
                      "",
                      f"**READ ERROR: {exc}**",
                      "",
                  ])
                  continue

              longest = max(
                  (
                      len(line) - len(line.lstrip("`"))
                      for line in content.splitlines()
                      if line and set(line.strip()) == {"`"}
                  ),
                  default=0
              )

              fence = "`" * max(3, longest + 1)

              output.extend([
                  f"## FILE: `P3/{relative}`",
                  "",
                  f"{fence}text",
                  content,
                  fence,
                  "",
              ])

          rendered = "\n".join(output)
          encoded = rendered.encode("utf-8")

          if len(encoded) > 950_000:
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write(
                      "# P3 COMPLETE TEXT DISPLAY FAILED\n\n"
                      f"Discovered {len(files)} files.\n\n"
                      f"Required display size: {len(encoded)} bytes.\n\n"
                      "The complete contents are retained in the workflow "
                      "artifact. The job summary was not silently truncated.\n"
                  )

              raise SystemExit(
                  "P3_TEXT_DISPLAY_EXCEEDS_GITHUB_SUMMARY_LIMIT"
              )

          with summary.open("a", encoding="utf-8") as stream:
              stream.write(rendered)

          print("P3_AUTOMATIC_TEXT_FILE_DISCOVERY_ACCEPTED")
          print(f"P3_TEXT_FILES_DISCOVERED={len(files)}")
          print(f"P3_TEXT_DISPLAY_BYTES={len(encoded)}")

          if missing:
              raise SystemExit(
                  "P3_INTEGRITY_FILES_NOT_DISPLAYED"
              )

          print("P3_MANIFEST_AND_SHA256SUMS_INCLUDED")
          print("P3_ALL_MD_CSX_TXT_FILES_DISPLAYED")
          PY

      # ========================================================
      # 11. FINAL VALIDATION VERDICT
      # ========================================================

      - name: Publish P3 final validation verdict
        id: p3_final_verdict
        if: always()
        shell: bash
        env:
          REQUIRED: ${{ steps.p3_required_files.outcome }}
          ENVIRONMENT: ${{ steps.p3_environment.outcome }}
          PYTHON_COMPILE: ${{ steps.p3_python_compile.outcome }}
          BENCHMARK_TESTS: ${{ steps.p3_benchmark_tests.outcome }}
          MANIFEST_TESTS: ${{ steps.p3_manifest_tests.outcome }}
          INTEGRITY_TESTS: ${{ steps.p3_integrity_tests.outcome }}
          PYTHON_TESTS: ${{ steps.p3_python_tests.outcome }}
          ROOT_MAVEN: ${{ steps.p3_root_maven.outcome }}
          BENCHMARK: ${{ steps.p3_benchmark.outcome }}
          BENCHMARK_SUMMARY: ${{ steps.p3_benchmark_summary.outcome }}
          INTEGRITY_GENERATE: ${{ steps.p3_integrity_generate.outcome }}
          INTEGRITY_VERIFY: ${{ steps.p3_integrity_verify.outcome }}
          INTEGRITY_CHECK: ${{ steps.p3_integrity_reproducibility.outcome }}
          MANIFEST_DISPLAY: ${{ steps.p3_display_manifest.outcome }}
          SHA256_DISPLAY: ${{ steps.p3_display_sha256.outcome }}
          TEXT_DISPLAY: ${{ steps.p3_display_all_text.outcome }}
        run: |
          set -Eeuo pipefail

          {
            echo
            echo "# P3 — FINAL VALIDATION VERDICT"
            echo
            echo "| Mandatory stage | Outcome |"
            echo "|---|---|"
            echo "| Required P3 files | $REQUIRED |"
            echo "| Environment capture | $ENVIRONMENT |"
            echo "| Python compilation | $PYTHON_COMPILE |"
            echo "| Benchmark validator tests | $BENCHMARK_TESTS |"
            echo "| Manifest generator tests | $MANIFEST_TESTS |"
            echo "| Independent integrity tests | $INTEGRITY_TESTS |"
            echo "| Complete Python tests | $PYTHON_TESTS |"
            echo "| Root Maven tests | $ROOT_MAVEN |"
            echo "| P3 Maven and benchmark | $BENCHMARK |"
            echo "| CSV/JSON benchmark summary | $BENCHMARK_SUMMARY |"
            echo "| Generate MANIFEST and SHA256SUMS | $INTEGRITY_GENERATE |"
            echo "| Independent integrity verification | $INTEGRITY_VERIFY |"
            echo "| Integrity reproducibility | $INTEGRITY_CHECK |"
            echo "| Individual MANIFEST verification and publication | $MANIFEST_DISPLAY |"
            echo "| Individual SHA256SUMS format/hash verification and publication | $SHA256_DISPLAY |"
            echo "| Full MD/CSX/TXT publication | $TEXT_DISPLAY |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for outcome in \
            "$REQUIRED" \
            "$ENVIRONMENT" \
            "$PYTHON_COMPILE" \
            "$BENCHMARK_TESTS" \
            "$MANIFEST_TESTS" \
            "$INTEGRITY_TESTS" \
            "$PYTHON_TESTS" \
            "$ROOT_MAVEN" \
            "$BENCHMARK" \
            "$BENCHMARK_SUMMARY" \
            "$INTEGRITY_GENERATE" \
            "$INTEGRITY_VERIFY" \
            "$INTEGRITY_CHECK" \
            "$MANIFEST_DISPLAY" \
            "$SHA256_DISPLAY" \
            "$TEXT_DISPLAY"
          do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "**P3_FINAL_VERDICT: REJECTED — at least one mandatory validation stage failed.**" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "P3_FINAL_VALIDATION_REJECTED"
            exit 1
          fi

          echo "**P3_FINAL_VERDICT: ALL CONFIGURED VALIDATION GATES PASSED.**" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "P3_FINAL_VALIDATION_GATES_PASSED"

      # ========================================================
      # 12. PUBLISH COMPLETE VALIDATION ARTIFACTS
      # ========================================================

      - name: Upload complete P3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P3-complete-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            P3/MANIFEST.txt
            P3/SHA256SUMS.txt
            P3/ACCEPTANCE_CHECKLIST.md
            P3/ACCEPTANCE_REPORT.md
            P3/INTEGRITY.md
            P3/P3_AUDIT_REPORT.md
            P3/VALIDATION_ALIGNMENT.md
            P3/VALIDATION_PROTOCOL.md
            P3/reports/
            P3/benchmarks/
            P3/results/
            P3/tools/
            P3/tests/
            P3/target/surefire-reports/
            target/surefire-reports/
