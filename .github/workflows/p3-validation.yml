name: QFLPN P3 Validation and Benchmark

on:
  push:
    branches:
      - main
    paths:
      - "P3/**"
      - ".github/workflows/p3-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P3/**"
      - ".github/workflows/p3-validation.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qflpn-p3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p3-validation:
    name: P3 Java and Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Record environment
        run: |
          java -version
          mvn --version
          python --version
          python -m pytest --version

      - name: Validate Maven project
        run: |
          mvn -B -f P3/pom.xml validate

      - name: Run complete Java test suite
        run: |
          mvn -B -f P3/pom.xml clean test

      - name: Run Python validator regression tests
        run: |
          python -m pytest \
            P3/results/test_validate_benchmark.py \
            -v

      - name: Run benchmark and generate evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          N: "1000000"
          WARMUP: "1"
          ITERATIONS: "2"
          THRESHOLD: "4096"
          PARALLELISM: "2"
        run: |
          bash P3/results/run_benchmark.sh

      - name: Upload benchmark evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: p3-benchmark-evidence
          path: |
            P3/benchmarks/benchmark_results.csv
            P3/results/raw/benchmark-QFLPN-1000000.log
            P3/results/raw/environment.txt
            P3/results/validation-report.json
            P3/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-junit-evidence
          path: P3/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit generated benchmark evidence
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "::error::Target branch is empty."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            P3/benchmarks/benchmark_results.csv \
            P3/results/raw/benchmark-QFLPN-1000000.log \
            P3/results/raw/environment.txt \
            P3/results/validation-report.json \
            P3/SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "No generated evidence changes."
            exit 0
          fi

          git commit -m "[skip ci] P3 automated benchmark evidence"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
