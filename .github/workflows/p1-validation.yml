name: P1 Canonical Reproducibility and Acceptance

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "P1/**"
      - ".github/workflows/p1-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "P1/**"
      - ".github/workflows/p1-validation.yml"

permissions:
  contents: write

concurrency:
  group: p1-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p1-canonical-validation:
    name: P1 Mathematical Validation and Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: P1/requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r P1/requirements-lock.txt

      - name: Capture execution environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p P1/reports

          ENV_FILE="P1/reports/environment.txt"

          {
            echo "QFLPN P1 EXECUTION ENVIRONMENT"
            echo
            echo "UTC timestamp:"
            date -u +%Y-%m-%dT%H:%M:%SZ

            echo
            echo "Repository:"
            git remote get-url origin

            echo
            echo "Git branch:"
            echo "${GITHUB_REF_NAME:-unknown}"

            echo
            echo "Git commit:"
            git rev-parse HEAD

            echo
            echo "GitHub workflow:"
            echo "${GITHUB_WORKFLOW:-unknown}"

            echo
            echo "GitHub run ID:"
            echo "${GITHUB_RUN_ID:-unknown}"

            echo
            echo "GitHub run attempt:"
            echo "${GITHUB_RUN_ATTEMPT:-unknown}"

            echo
            echo "Python:"
            python --version

            echo
            echo "Pip:"
            python -m pip --version

            echo
            echo "Pytest:"
            python -m pytest --version

            echo
            echo "NumPy and SciPy:"
            python -c "import numpy, scipy; print('NumPy:', numpy.__version__); print('SciPy:', scipy.__version__)"

            echo
            echo "Operating system:"
            uname -a

            echo
            echo "CPU:"
            if command -v lscpu >/dev/null 2>&1; then
              lscpu
            else
              echo "lscpu unavailable"
            fi

            echo
            echo "Memory:"
            if command -v free >/dev/null 2>&1; then
              free -h
            else
              echo "free unavailable"
            fi

            echo
            echo "Python dependency lock:"
            cat P1/requirements-lock.txt

          } > "$ENV_FILE" 2>&1

          test -s "$ENV_FILE"

          echo "[PASS] P1 execution environment captured"
          cat "$ENV_FILE"

      - name: Compile P1 sources
        run: |
          python -m compileall -q P1/code P1/tests P1/tools

      - name: Run legacy P1 mathematical validation
        run: |
          python P1/tests/qflpn_validation.py

      - name: Run legacy CSR rotation consistency validation
        run: |
          python P1/tests/qflpn_operator_validation.py

      - name: Generate canonical reference instance
        run: |
          python P1/tools/generate_reference_instance.py

      - name: Verify gates, basis convention, and independent implementation
        run: |
          python P1/tools/verify_reference_instance.py

      - name: Compute formal numerical residuals
        run: |
          python P1/tools/compute_residuals.py

      - name: Generate existing P1 reports
        run: |
          python P1/tools/generate_p1_reports.py

      - name: Run complete P1 test suite
        id: pytest
        shell: bash
        run: |
          mkdir -p P1/reports

          set +e

          python -m pytest -q P1/tests \
            --junitxml=P1/reports/junit.xml

          rc=$?

          set -e

          printf '%s\n' "$rc" \
            > P1/reports/pytest_exit_code.txt

          echo "pytest_exit_code=$rc" >> "$GITHUB_OUTPUT"

          echo "Pytest exit code: $rc"

          # Do not stop evidence aggregation.
          # The final verifier remains responsible for rejection.
          exit 0

      - name: Aggregate test and numerical evidence
        if: always()
        run: |
          python P1/tools/write_test_results.py

      - name: Generate manifest and SHA-256 inventory
        if: always()
        run: |
          python P1/tools/compute_checksums.py

      - name: Verify final P1 package
        id: final_verification
        if: always()
        shell: bash
        run: |
          set +e

          python P1/tools/verify_final_package.py
          rc=$?

          set -e

          if [ "$rc" -eq 0 ]; then
            echo "P1_VERDICT=P1_ACCEPTED" >> "$GITHUB_ENV"
            echo "verdict=P1_ACCEPTED" >> "$GITHUB_OUTPUT"
            echo "[PASS] P1_ACCEPTED"
          else
            echo "P1_VERDICT=P1_REJECTED" >> "$GITHUB_ENV"
            echo "verdict=P1_REJECTED" >> "$GITHUB_OUTPUT"
            echo "[FAIL] P1_REJECTED"
            exit "$rc"
          fi

      - name: Publish P1 validation summary
        if: always()
        env:
          P1_VERDICT: ${{ steps.final_verification.outputs.verdict }}
        run: |
          python P1/tools/write_github_summary.py

      - name: Upload P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-canonical-validation-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            P1/artifacts/
            P1/reports/
            P1/MANIFEST.txt
            P1/SHA256SUMS.txt

      - name: Commit generated P1 evidence
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            P1/artifacts/ \
            P1/reports/ \
            P1/MANIFEST.txt \
            P1/SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "No generated P1 evidence changes to commit."
            exit 0
          fi

          git commit \
            -m "P1 automated validation evidence [skip ci]"

          git push \
            origin \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
