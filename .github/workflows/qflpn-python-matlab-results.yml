name: QFLPN Python MATLAB Results

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'matlab/**'
      - '.github/workflows/qflpn-python-matlab-results.yml'

jobs:

  python-results:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Run QFLPN Python benchmark
        working-directory: python
        run: |
          python qflpn_benchmark.py

      - name: Generate QFLPN figures
        working-directory: python
        run: |
          python plot_qflpn_results.py

      - name: Display Python benchmark result
        working-directory: python
        run: |
          echo "=============================="
          echo "QFLPN PYTHON CSV"
          echo "=============================="
          cat qflpn_python_results.csv

      - name: Upload Python CSV
        uses: actions/upload-artifact@v4
        with:
          name: qflpn-python-results
          path: |
            python/qflpn_python_results.csv
          if-no-files-found: error

      - name: Upload Python figures
        uses: actions/upload-artifact@v4
        with:
          name: qflpn-python-figures
          path: |
            python/qflpn_execution_time.png
          if-no-files-found: error


  matlab-compatible-results:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Run MATLAB-compatible QFLPN benchmark
        run: |
          octave --quiet --eval \
            "cd('matlab'); qflpn_benchmark;"

      - name: Display MATLAB-compatible benchmark result
        working-directory: matlab
        run: |
          echo "=============================="
          echo "QFLPN MATLAB-COMPATIBLE CSV"
          echo "=============================="
          cat qflpn_matlab_results.csv

      - name: Upload MATLAB-compatible CSV
        uses: actions/upload-artifact@v4
        with:
          name: qflpn-matlab-compatible-results
          path: |
            matlab/qflpn_matlab_results.csv
          if-no-files-found: error
